<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PSHS-WVCIC | Infrastructure Progress Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #020617; color: #f1f5f9; letter-spacing: -0.02em; }
        
        /* Dropbars */
        .detail-bar { background-color: rgba(15, 23, 42, 0.5); padding: 1rem 1.5rem; border-radius: 0.75rem; border: 1px solid rgba(30, 41, 59, 0.8); margin-bottom: 0.75rem; cursor: pointer; transition: all 0.3s; display: block; }
        .detail-bar:hover { background-color: rgba(30, 41, 59, 0.8); }
        .summary-flex { display: flex; justify-content: space-between; align-items: center; width: 100%; }
        .chevron-icon { font-size: 12px; color: #64748b; transition: transform 0.3s; }
        details[open] .chevron-icon { transform: rotate(90deg); color: #6366f1; }
        details summary::-webkit-details-marker { display: none; }
        details > summary { list-style: none; outline: none; }

        /* Lists */
        .list-row { display: flex; gap: 1rem; padding: 0.5rem 0; border-bottom: 1px solid rgba(30, 41, 59, 0.3); align-items: flex-start; }
        .list-row:last-child { border-bottom: none; }
    </style>
</head>
<body>

    <nav class="bg-[#020617]/95 backdrop-blur-3xl border-b border-slate-800/50 px-8 py-5 sticky top-0 z-50">
        <div class="max-w-[1700px] mx-auto flex justify-between items-center">
            <div class="flex items-center gap-4">
                <div class="w-10 h-10 rounded-xl flex items-center justify-center overflow-hidden shadow-lg border border-slate-700/50 bg-[#0f172a]">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/c/c6/PSHS_System_Logo.png" alt="PSHS Logo" class="w-full h-full object-contain p-1">
                </div>
                <div>
                    <h1 class="text-xl font-black tracking-tighter uppercase leading-none text-white">PSHS-WVCIC</h1>
                    <p class="text-[9px] font-bold text-slate-400 uppercase tracking-[0.3em] mt-1">Infrastructure Progress Dashboard</p>
                </div>
            </div>
            <div class="flex items-center gap-2 bg-emerald-500/10 text-emerald-400 px-4 py-2 rounded-full border border-emerald-500/20 text-[9px] font-black uppercase tracking-widest">
                <span class="w-1.5 h-1.5 bg-emerald-500 rounded-full animate-pulse"></span> Live Database
            </div>
        </div>
    </nav>

    <main class="max-w-[1700px] mx-auto px-6 py-8">
        
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-6 gap-5 mb-8">
            
            <div class="relative p-6 rounded-[1.5rem] shadow-lg flex flex-col justify-between min-h-[140px] bg-gradient-to-br from-blue-600 to-indigo-800 overflow-hidden hover:-translate-y-1 transition-transform">
                <i class="fas fa-wallet absolute right-4 top-4 text-4xl text-white/20"></i>
                <span class="text-[10px] font-black text-white/80 uppercase tracking-widest z-10">Allocation</span>
                <span id="kpi-budget" class="text-2xl lg:text-3xl font-black text-white tabular-nums tracking-tighter mt-2 mb-1 z-10">₱0.00</span>
                <span class="text-[9px] font-bold text-white/60 uppercase tracking-widest z-10 mt-auto">Total Budget</span>
            </div>
            
            <div class="relative p-6 rounded-[1.5rem] shadow-lg flex flex-col justify-between min-h-[140px] bg-gradient-to-br from-violet-600 to-purple-900 overflow-hidden hover:-translate-y-1 transition-transform">
                <i class="fas fa-file-invoice-dollar absolute right-4 top-4 text-4xl text-white/20"></i>
                <span class="text-[10px] font-black text-white/80 uppercase tracking-widest z-10">Expenditure</span>
                <span id="kpi-actual" class="text-2xl lg:text-3xl font-black text-white tabular-nums tracking-tighter mt-2 mb-1 z-10">₱0.00</span>
                <span class="text-[9px] font-bold text-white/60 uppercase tracking-widest z-10 mt-auto">Capital Utilized</span>
            </div>
            
            <div class="relative p-6 rounded-[1.5rem] shadow-lg flex flex-col justify-between min-h-[140px] bg-gradient-to-br from-rose-500 to-red-800 overflow-hidden hover:-translate-y-1 transition-transform">
                <i class="fas fa-chart-pie absolute right-4 top-4 text-4xl text-white/20"></i>
                <span class="text-[10px] font-black text-white/80 uppercase tracking-widest z-10">Variance</span>
                <span id="kpi-variance" class="text-2xl lg:text-3xl font-black text-white tabular-nums tracking-tighter mt-2 mb-1 z-10">₱0.00</span>
                <span class="text-[9px] font-bold text-white/60 uppercase tracking-widest z-10 mt-auto">Remaining Capital</span>
            </div>

            <div class="relative p-6 rounded-[1.5rem] shadow-lg flex flex-col justify-between min-h-[140px] bg-gradient-to-br from-emerald-500 to-teal-800 overflow-hidden hover:-translate-y-1 transition-transform">
                <i class="fas fa-tasks absolute right-4 top-4 text-4xl text-white/20"></i>
                <span class="text-[10px] font-black text-white/80 uppercase tracking-widest z-10">Execution</span>
                <span id="kpi-progress" class="text-3xl lg:text-4xl font-extrabold italic text-white tabular-nums tracking-tighter mt-1 mb-1 z-10">0%</span>
                <span class="text-[9px] font-bold text-white/60 uppercase tracking-widest z-10 mt-auto">Physical Avg</span>
            </div>

            <div class="bg-[#0f172a] p-5 rounded-[1.5rem] border border-slate-800 shadow-lg flex flex-col items-center justify-center text-center">
                <span class="text-[9px] font-black text-slate-500 uppercase tracking-widest mb-1">SPI (Schedule)</span>
                <div class="w-16 h-8 relative mt-1"><canvas id="gaugeSPI"></canvas></div>
                <span id="spi-text" class="text-xl font-black tabular-nums tracking-tighter text-indigo-400 mt-1">1.00</span>
            </div>

            <div class="bg-[#0f172a] p-5 rounded-[1.5rem] border border-slate-800 shadow-lg flex flex-col items-center justify-center text-center">
                <span class="text-[9px] font-black text-slate-500 uppercase tracking-widest mb-1">CPI (Cost)</span>
                <div class="w-16 h-8 relative mt-1"><canvas id="gaugeCPI"></canvas></div>
                <span id="cpi-text" class="text-xl font-black tabular-nums tracking-tighter text-emerald-400 mt-1">1.00</span>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-5 mb-8">
            <div class="bg-[#0f172a] p-6 rounded-[2rem] border border-slate-800 shadow-lg">
                <span class="text-[11px] font-black text-slate-400 uppercase tracking-widest mb-4 block border-b border-slate-800/50 pb-3">
                    <i class="fas fa-circle-notch text-indigo-500 mr-2"></i> Portfolio Health
                </span>
                <div style="position: relative; height: 220px; width: 100%;">
                    <canvas id="statusChart"></canvas>
                </div>
            </div>
            
            <div class="bg-[#0f172a] p-6 rounded-[2rem] border border-slate-800 shadow-lg lg:col-span-2">
                <span class="text-[11px] font-black text-slate-400 uppercase tracking-widest mb-4 block border-b border-slate-800/50 pb-3">
                    <i class="fas fa-chart-bar text-purple-500 mr-2"></i> Top 5 Projects: Allocation vs. Expenditure
                </span>
                <div style="position: relative; height: 220px; width: 100%;">
                    <canvas id="budgetChart"></canvas>
                </div>
            </div>
        </div>

        <div class="flex flex-col sm:flex-row gap-4 mb-8 items-center">
            <div class="relative flex-grow w-full">
                <i class="fas fa-search absolute left-5 top-1/2 -translate-y-1/2 text-slate-500 text-sm"></i>
                <input type="text" id="searchInput" placeholder="Filter projects..." class="w-full pl-12 pr-6 py-4 rounded-full border border-slate-800 bg-[#0f172a] text-white font-bold text-sm outline-none focus:ring-2 focus:ring-indigo-500/50">
            </div>
            <select id="fyFilter" onchange="renderUI()" class="w-full sm:w-auto min-w-[200px] px-6 py-4 rounded-full border border-slate-800 bg-[#0f172a] text-slate-300 font-bold text-sm outline-none cursor-pointer"></select>
        </div>

        <div id="project-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 pb-20"></div>
    </main>

    <script>
        // PROTECTED URL 
        const scriptURL = `https\u003A//script.google.com/macros/s/AKfycbz-9wukcFnCwKNhcmTrTRQaY9fc_vOJA8O6yqNA71XKrJmiAj-b5f6uYzSG07JUjAcR/exec`;
        
        let allProjects = [];
        let charts = {};

        async function init() {
            try {
                const response = await fetch(scriptURL);
                allProjects = await response.json();
                populateFYFilter();
                initCharts();
                renderUI();
            } catch (e) { console.error("Sync Failure:", e); }
        }

        function populateFYFilter() {
            const fySelect = document.getElementById('fyFilter');
            const years = [...new Set(allProjects.map(p => p.FiscalYear).filter(y => y))].sort().reverse();
            fySelect.innerHTML = '<option value="All">All Fiscal Years</option>' + years.map(y => `<option value="${y}">FY ${y}</option>`).join('');
        }

        function clean(v) {
            if (!v) return 0;
            const str = v.toString().replace(/[^\d.-]/g, '');
            const num = parseFloat(str);
            return isNaN(num) ? 0 : num;
        }

        function renderUI() {
            const term = document.getElementById('searchInput').value.toLowerCase();
            const fy = document.getElementById('fyFilter').value;
            const filtered = allProjects.filter(p => {
                const pool = `${p.ProjectName} ${p.Contractor} ${p.Location}`.toLowerCase();
                return pool.includes(term) && (fy === 'All' || p.FiscalYear === fy);
            });
            renderCards(filtered);
            updateKPIs(filtered);
            updateAnalytics(filtered);
        }

        function renderCards(projects) {
            const grid = document.getElementById('project-grid');
            grid.innerHTML = projects.length ? '' : '<div class="col-span-full py-10 text-center opacity-30 font-black uppercase text-xs tracking-widest">No Records Found</div>';

            projects.forEach(p => {
                const accent = p.Status === 'Completed' ? 'bg-emerald-500' : (p.Status === 'In Progress' ? 'bg-amber-500' : 'bg-slate-700');
                const badgeStyle = p.Status === 'Completed' ? 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20' : (p.Status === 'In Progress' ? 'bg-amber-500/10 text-amber-400 border-amber-500/20' : 'bg-slate-800 text-slate-400 border-slate-700');
                const cost = '₱' + clean(p.Cost).toLocaleString('en-PH', {minimumFractionDigits: 2});
                
                const listParser = (str) => {
                    if (!str || str === "---") return '<p class="text-[11px] text-slate-600 italic px-2 py-1">No records found</p>';
                    return str.split(/[;\n]/).filter(x => x.trim()).map((item, index) => {
                        return `<div class="list-row"><span class="text-[11px] font-black text-indigo-400 min-w-[18px] mt-0.5">${index + 1}.</span><span class="text-[12px] font-semibold text-slate-300 leading-snug">${item.trim()}</span></div>`;
                    }).join('');
                };

                grid.innerHTML += `
                    <div class="bg-[#0f172a] border border-slate-800 rounded-[2rem] overflow-hidden flex flex-col h-full shadow-lg">
                        <div class="h-2 w-full ${accent}"></div>
                        <div class="p-6 flex flex-col h-full">
                            <div class="flex justify-between items-center mb-4">
                                <span class="px-3 py-1 rounded-full text-[8px] font-black uppercase tracking-widest border ${badgeStyle}">${p.Status}</span>
                                <span class="text-[9px] font-black text-slate-500 uppercase tracking-widest">${p.FiscalYear || 'FY --'}</span>
                            </div>
                            <h3 class="text-lg font-black leading-tight uppercase mb-6 min-h-[3.5rem] text-white tracking-tight">${p.ProjectName}</h3>
                            
                            <details class="group">
                                <summary class="detail-bar">
                                    <div class="summary-flex">
                                        <span class="text-[12px] font-black text-slate-300 uppercase tracking-widest flex items-center"><i class="fas fa-drafting-compass mr-2 text-indigo-400"></i> Scope</span>
                                        <span class="chevron-icon"><i class="fas fa-chevron-right"></i></span>
                                    </div>
                                </summary>
                                <div class="mb-4 px-2">${listParser(p.Scope)}</div>
                            </details>

                            <details class="group">
                                <summary class="detail-bar">
                                    <div class="summary-flex">
                                        <span class="text-[12px] font-black text-slate-300 uppercase tracking-widest flex items-center"><i class="fas fa-pen-nib mr-2 text-slate-500"></i> Remarks</span>
                                        <span class="chevron-icon"><i class="fas fa-chevron-right"></i></span>
                                    </div>
                                </summary>
                                <div class="mb-4 px-2">${listParser(p.Notes)}</div>
                            </details>

                            <div class="mt-auto pt-5 border-t border-slate-800">
                                <div class="grid grid-cols-2 gap-3 mb-5">
                                    <div><p class="text-[8px] font-black text-slate-500 uppercase mb-1 tracking-widest">Target Finish</p><p class="text-[10px] font-black text-slate-200">${p.TargetDate || '---'}</p></div>
                                    <div class="text-right"><p class="text-[8px] font-black text-slate-500 uppercase mb-1 tracking-widest">Valuation</p><p class="text-[11px] font-black text-white tabular-nums">${cost}</p></div>
                                </div>
                                ${p.AttachmentURL ? `<a href="${p.AttachmentURL}" target="_blank" class="w-full py-3 bg-white text-[#030712] rounded-xl text-[9px] font-black uppercase tracking-widest flex items-center justify-center gap-2 hover:bg-indigo-600 hover:text-white transition-all shadow-md"><i class="fas fa-file-contract"></i> Record Vault</a>` : `<div class="w-full py-3 bg-[#0f172a] text-slate-600 rounded-xl text-[9px] font-black uppercase text-center tracking-widest italic border border-slate-800">Offline</div>`}
                                <div class="mt-6">
                                    <div class="flex justify-between items-center text-[9px] font-black text-slate-500 uppercase tracking-widest mb-2"><span>Progress</span><span class="text-indigo-400">${p.Progress || 0}%</span></div>
                                    <div class="w-full bg-slate-800 h-1.5 rounded-full overflow-hidden shadow-inner"><div class="bg-indigo-500 h-full transition-all duration-1000" style="width: ${p.Progress || 0}%"></div></div>
                                </div>
                            </div>
                        </div>
                    </div>`;
            });
        }

        function initCharts() {
            Chart.defaults.color = '#94a3b8';
            Chart.defaults.font.family = 'Plus Jakarta Sans';

            const gaugeOpt = { cutout: '80%', circumfrence: 180, rotation: 270, plugins: { legend: { display: false }, tooltip: { enabled: false } }, responsive: true, maintainAspectRatio: false };
            charts.spi = new Chart(document.getElementById('gaugeSPI'), { type: 'doughnut', data: { datasets: [{ data: [0.5, 0.5], backgroundColor: ['#6366f1', '#1e293b'], borderWidth: 0 }] }, options: gaugeOpt });
            charts.cpi = new Chart(document.getElementById('gaugeCPI'), { type: 'doughnut', data: { datasets: [{ data: [0.5, 0.5], backgroundColor: ['#10b981', '#1e293b'], borderWidth: 0 }] }, options: gaugeOpt });

            charts.status = new Chart(document.getElementById('statusChart'), {
                type: 'doughnut',
                data: { labels: [], datasets: [{ data: [], backgroundColor: ['#10b981', '#f59e0b', '#334155'], borderWidth: 0, hoverOffset: 4 }] },
                options: { responsive: true, maintainAspectRatio: false, cutout: '75%', plugins: { legend: { position: 'bottom', labels: { padding: 15, font: { size: 10, weight: 'bold' } } } } }
            });

            charts.budget = new Chart(document.getElementById('budgetChart'), {
                type: 'bar',
                data: { labels: [], datasets: [
                    { label: 'Allocated', data: [], backgroundColor: '#3b82f6', borderRadius: 4, barPercentage: 0.7 },
                    { label: 'Expenditure', data: [], backgroundColor: '#8b5cf6', borderRadius: 4, barPercentage: 0.7 }
                ]},
                options: {
                    indexAxis: 'y', responsive: true, maintainAspectRatio: false,
                    plugins: { legend: { position: 'top', align: 'end', labels: { boxWidth: 10, font: { size: 10, weight: 'bold' } } } },
                    scales: {
                        x: { grid: { color: 'rgba(30, 41, 59, 0.5)' }, ticks: { font: { size: 10 }, callback: function(val) { return '₱' + (val/1000000).toFixed(1) + 'M'; } } },
                        y: { grid: { display: false }, ticks: { font: { size: 10, weight: 'bold' } } }
                    }
                }
            });
        }

        function updateAnalytics(data) {
            if(!data || data.length === 0) return;
            let counts = { 'Completed': 0, 'In Progress': 0, 'Proposed': 0 };
            data.forEach(p => {
                let s = p.Status ? p.Status.toString().toLowerCase() : '';
                if(s.includes('complete')) counts['Completed']++;
                else if(s.includes('progress') || s.includes('ongoing')) counts['In Progress']++;
                else counts['Proposed']++;
            });
            charts.status.data.labels = ['Completed', 'In Progress', 'Proposed'];
            charts.status.data.datasets[0].data = [counts['Completed'], counts['In Progress'], counts['Proposed']];
            charts.status.update();

            let sortedByCost = [...data].sort((a, b) => clean(b.Cost) - clean(a.Cost)).slice(0, 5);
            charts.budget.data.labels = sortedByCost.map(p => {
                let name = p.ProjectName || 'Unknown';
                return name.length > 25 ? name.substring(0, 25) + '...' : name;
            });
            charts.budget.data.datasets[0].data = sortedByCost.map(p => clean(p.Cost));
            charts.budget.data.datasets[1].data = sortedByCost.map(p => clean(p.ActualCost));
            charts.budget.update();
        }

        function updateKPIs(data) {
            const total = data.reduce((sum, p) => sum + clean(p.Cost), 0);
            const actual = data.reduce((sum, p) => sum + clean(p.ActualCost), 0);
            const planned = data.reduce((sum, p) => sum + clean(p.PlannedValue || p['Planned Value']), 0);
            const avg = data.length ? data.reduce((sum, p) => sum + clean(p.Progress), 0) / data.length : 0;
            
            document.getElementById('kpi-budget').textContent = '₱' + total.toLocaleString('en-PH');
            document.getElementById('kpi-actual').textContent = '₱' + actual.toLocaleString('en-PH');
            document.getElementById('kpi-variance').textContent = '₱' + (total - actual).toLocaleString('en-PH');
            document.getElementById('kpi-progress').textContent = Math.round(avg) + '%';
            
            const ev = total * (avg / 100);
            const spi = planned > 0 ? ev / planned : 1;
            const cpi = actual > 0 ? ev / actual : 1;
            
            document.getElementById('spi-text').textContent = spi.toFixed(2);
            document.getElementById('cpi-text').textContent = cpi.toFixed(2);
            
            charts.spi.data.datasets[0].data = [spi > 1 ? 1 : spi, spi > 1 ? 0 : 1 - spi];
            charts.cpi.data.datasets[0].data = [cpi > 1 ? 1 : cpi, cpi > 1 ? 0 : 1 - cpi];
            charts.spi.update(); charts.cpi.update();
        }

        document.getElementById('searchInput').addEventListener('input', renderUI);
        init();
    </script>
</body>
</html>
