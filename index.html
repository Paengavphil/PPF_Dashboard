<component name="canvas" id="v46-numbered-executive" type="code" title="PSHS Executive Numbered Console v46" language="html" version="46">
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PSHS-WVCIC | Strategic Milestone Hub</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root { --bg: #030712; --card: #111827; --border: #1f2937; --accent: #6366f1; }
body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: var(--bg); color: #f1f5f9; letter-spacing: -0.01em; }
.dashboard-container { @apply max-w-[1750px] mx-auto px-10 py-10; }

    /* KPI Tiles - Reduced Padding */
    .kpi-tile { @apply bg-[#111827] p-8 rounded-[2.5rem] border border-gray-800 shadow-2xl flex flex-col justify-between min-h-[160px] transition-all hover:border-indigo-500/30; }
    .kpi-label { @apply text-[9px] font-black text-gray-500 uppercase tracking-[0.3em] mb-2; }
    .kpi-value { @apply text-2xl font-black text-white tabular-nums tracking-tighter; }
    
    .kpi-hero { @apply bg-indigo-600 border-none shadow-indigo-600/20 ring-1 ring-white/10; }
    .kpi-hero .kpi-value { @apply text-4xl italic font-extrabold; }

    /* Infrastructure Card - Optimized Spacing (Ref: User request v46) */
    .project-card { @apply bg-[#111827] border border-gray-800 rounded-[3rem] overflow-hidden flex flex-col h-full transition-all duration-500 hover:shadow-indigo-500/10 hover:-translate-y-2; }
    .status-accent { @apply h-3 w-full; }
    .bg-completed { @apply bg-emerald-500; }
    .bg-ongoing { @apply bg-amber-500; }
    .bg-proposed { @apply bg-slate-600; }

    /* DROPBARS & ROTATION (Ref: image_92dd08) */
    .detail-bar { @apply bg-gray-900/40 p-6 rounded-2xl border border-gray-800 mb-4 flex items-center justify-between cursor-pointer hover:bg-gray-800/80 transition-all; }
    .chevron-icon { @apply text-[10px] text-gray-600 transition-transform duration-300; }
    details[open] .chevron-icon { transform: rotate(90deg); color: #6366f1; }

    /* NUMBERED LIST STYLE */
    .list-row { @apply flex gap-4 py-3 border-b border-gray-800/20 last:border-none items-start; }
    .list-number { @apply text-[11px] font-black text-indigo-400 min-w-[20px] mt-1; }
    .list-text { @apply text-[13px] font-bold text-gray-400 leading-relaxed; }

    .search-hub { @apply w-full pl-16 pr-8 py-5 rounded-[2.5rem] border border-gray-800 bg-[#111827] text-white font-bold text-sm outline-none focus:ring-4 focus:ring-indigo-500/10 focus:border-indigo-500/50; }
    
    details summary::-webkit-details-marker { display: none; }
    details > summary { list-style: none; }
</style>
</head>
<body>

<nav class="bg-[#030712]/95 backdrop-blur-2xl border-b border-gray-800 px-10 py-6 sticky top-0 z-50">
    <div class="max-w-[1750px] mx-auto flex justify-between items-center">
        <div class="flex items-center gap-6">
            <div class="bg-indigo-600 w-11 h-11 rounded-2xl flex items-center justify-center shadow-indigo-600/30 shadow-2xl border border-white/10"><i class="fas fa-layer-group text-white text-xs"></i></div>
            <div>
                <h1 class="text-lg font-black tracking-tighter uppercase leading-none text-white">PSHS-WVCIC</h1>
                <p class="text-[9px] font-bold text-gray-500 uppercase tracking-[0.4em] mt-1.5">Executive Terminal v46</p>
            </div>
        </div>
        <div class="flex items-center gap-3 bg-emerald-500/5 text-emerald-400 px-5 py-2.5 rounded-full border border-emerald-500/10 text-[9px] font-black uppercase tracking-widest">
            <span class="w-2 h-2 bg-emerald-500 rounded-full animate-pulse"></span> Data Core Connected
        </div>
    </div>
</nav>

<main class="dashboard-container">
    
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-6 gap-8 mb-16">
        <div class="kpi-tile border-l-4 border-l-indigo-600">
            <span class="kpi-label">Allocated Budget</span>
            <span id="kpi-budget" class="kpi-value text-white">₱0.00</span>
        </div>
        <div class="kpi-tile">
            <span class="kpi-label">Expenditure</span>
            <span id="kpi-actual" class="kpi-value text-gray-400">₱0.00</span>
        </div>
        <div class="kpi-tile">
            <span class="kpi-label">Financial Variance</span>
            <span id="kpi-variance" class="kpi-value text-rose-500">₱0.00</span>
        </div>
        <div class="kpi-tile kpi-hero">
            <span class="kpi-label text-indigo-200">Portfolio Progress</span>
            <span id="kpi-progress" class="kpi-value">0%</span>
        </div>
        <div class="kpi-tile items-center justify-center">
            <span class="kpi-label mb-3">SPI (Schedule)</span>
            <div class="w-24 h-12 relative"><canvas id="gaugeSPI"></canvas></div>
            <span id="spi-text" class="text-[11px] font-black mt-3 text-indigo-400 tracking-widest">1.00</span>
        </div>
        <div class="kpi-tile items-center justify-center">
            <span class="kpi-label mb-3">CPI (Cost)</span>
            <div class="w-24 h-12 relative"><canvas id="gaugeCPI"></canvas></div>
            <span id="cpi-text" class="text-[11px] font-black mt-3 text-emerald-400 tracking-widest">1.00</span>
        </div>
    </div>

    <div class="flex flex-col xl:flex-row gap-8 mb-16 items-center">
        <div class="relative flex-grow w-full">
            <i class="fas fa-search absolute left-7 top-1/2 -translate-y-1/2 text-gray-700"></i>
            <input type="text" id="searchInput" placeholder="Search Strategic Project Milestone Records..." class="search-hub">
        </div>
        <select id="fyFilter" onchange="renderUI()" class="search-hub w-auto min-w-[240px] bg-[#111827] border-gray-800 text-gray-500 cursor-pointer"></select>
    </div>

    <div id="project-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-12 pb-48"></div>
</main>

<script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbz-9wukcFnCwKNhcmTrTRQaY9fc_vOJA8O6yqNA71XKrJmiAj-b5f6uYzSG07JUjAcR/exec';
    let allProjects = [];
    let charts = {};

    async function init() {
        try {
            const response = await fetch(scriptURL);
            allProjects = await response.json();
            populateFYFilter();
            initCharts();
            renderUI();
        } catch (e) { console.error("Handshake Link Severed:", e); }
    }

    function populateFYFilter() {
        const fySelect = document.getElementById('fyFilter');
        const years = [...new Set(allProjects.map(p => p.FiscalYear).filter(y => y))].sort().reverse();
        fySelect.innerHTML = '<option value="All">All Fiscal Years</option>' + years.map(y => `<option value="${y}">FY ${y}</option>`).join('');
    }

    function clean(v) {
        if (!v) return 0;
        const str = v.toString().replace(/[^\d.-]/g, '');
        const num = parseFloat(str);
        return isNaN(num) ? 0 : num;
    }

    function renderUI() {
        const term = document.getElementById('searchInput').value.toLowerCase();
        const fy = document.getElementById('fyFilter').value;
        const filtered = allProjects.filter(p => {
            const pool = `${p.ProjectName} ${p.Contractor} ${p.Location}`.toLowerCase();
            return pool.includes(term) && (fy === 'All' || p.FiscalYear === fy);
        });
        renderCards(filtered);
        updateKPIs(filtered);
    }

    function renderCards(projects) {
        const grid = document.getElementById('project-grid');
        grid.innerHTML = projects.length ? '' : '<div class="col-span-full py-40 text-center opacity-10 font-black uppercase text-xs tracking-[1em]">Scanning Core</div>';

        projects.forEach(p => {
            const accent = p.Status === 'Completed' ? 'bg-completed' : (p.Status === 'In Progress' ? 'bg-ongoing' : 'bg-slate-700');
            const badge = p.Status === 'Completed' ? 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20' : (p.Status === 'In Progress' ? 'bg-amber-500/10 text-amber-400 border-amber-500/20' : 'bg-gray-800/50 text-gray-500');
            const cost = '₱' + clean(p.Cost).toLocaleString('en-PH', {minimumFractionDigits: 2});
            
            // AUTOMATIC NUMBERING PARSER (Ref: User request v46)
            const listParser = (str) => {
                if (!str || str === "---") return '<p class="text-[12px] text-gray-600 italic px-2">No data recorded</p>';
                return str.split(/[;\n]/).filter(x => x.trim()).map((item, index) => {
                    return `
                        <div class="list-row">
                            <span class="list-number">${index + 1}.</span>
                            <span class="list-text">${item.trim()}</span>
                        </div>`;
                }).join('');
            };

            grid.innerHTML += `
                <div class="project-card shadow-2xl">
                    <div class="status-accent ${accent}"></div>
                    <div class="p-10 flex flex-col h-full">
                        <div class="flex justify-between items-center mb-8">
                            <span class="badge px-4 py-2 rounded-full text-[9px] font-black uppercase tracking-widest border border-white/5 shadow-lg">${p.Status}</span>
                            <span class="text-[10px] font-black text-gray-600 uppercase tracking-[0.2em]">${p.FiscalYear || 'FY --'}</span>
                        </div>
                        
                        <h3 class="text-2xl font-black leading-tight uppercase mb-10 min-h-[5.5rem] text-white tracking-tight italic">${p.ProjectName}</h3>
                        
                        <details class="group"><summary class="detail-bar"><span class="text-[10px] font-black text-gray-500 uppercase tracking-widest"><i class="fas fa-layer-group mr-4 text-indigo-500"></i> Scope of Works</span><span class="chevron-icon"><i class="fas fa-chevron-right"></i></span></summary><div class="mb-10 px-2">${listParser(p.Scope)}</div></details>
                        <details class="group"><summary class="detail-bar"><span class="text-[10px] font-black text-gray-500 uppercase tracking-widest"><i class="fas fa-feather-pointed mr-4 text-gray-600"></i> Admin Remarks</span><span class="chevron-icon"><i class="fas fa-chevron-right"></i></span></summary><div class="mb-10 px-2">${listParser(p.Notes)}</div></details>

                        <div class="mt-auto pt-10 border-t border-gray-800">
                            <div class="grid grid-cols-2 gap-4 mb-8">
                                <div><p class="text-[9px] font-black text-gray-600 uppercase mb-2 tracking-widest">Target Finish</p><p class="text-[11px] font-black text-white">${p.TargetDate || '---'}</p></div>
                                <div class="text-right"><p class="text-[9px] font-black text-gray-600 uppercase mb-2 tracking-widest">Valuation</p><p class="text-xs font-black text-white tabular-nums">${cost}</p></div>
                            </div>
                            ${p.AttachmentURL ? `<a href="${p.AttachmentURL}" target="_blank" class="w-full py-5 bg-white text-[#030712] rounded-3xl text-[10px] font-black uppercase tracking-[0.4em] flex items-center justify-center gap-4 hover:bg-indigo-600 hover:text-white transition-all shadow-2xl"><i class="fas fa-file-contract"></i> Record Vault</a>` : `<div class="w-full py-5 bg-gray-800 text-gray-600 rounded-3xl text-[10px] font-black uppercase text-center tracking-widest italic border border-gray-700/30">Archives Offline</div>`}
                            <div class="mt-12">
                                <div class="flex justify-between items-center text-[10px] font-black text-gray-600 uppercase tracking-widest mb-4"><span>Physical Execution</span><span class="text-indigo-400 font-black">${p.Progress || 0}%</span></div>
                                <div class="w-full bg-gray-800 h-2.5 rounded-full overflow-hidden shadow-inner"><div class="bg-indigo-600 h-full transition-all duration-1000 shadow-[0_0_20px_#6366f1]" style="width: ${p.Progress || 0}%"></div></div>
                            </div>
                        </div>
                    </div>
                </div>`;
        });
    }

    function initCharts() {
        const opt = { cutout: '82%', circumfrence: 180, rotation: 270, plugins: { legend: { display: false } }, responsive: true, maintainAspectRatio: false };
        charts.spi = new Chart(document.getElementById('gaugeSPI'), { type: 'doughnut', data: { datasets: [{ data: [0.5, 0.5], backgroundColor: ['#6366f1', '#1f2937'], borderWidth: 0 }] }, options: opt });
        charts.cpi = new Chart(document.getElementById('gaugeCPI'), { type: 'doughnut', data: { datasets: [{ data: [0.5, 0.5], backgroundColor: ['#10b981', '#1f2937'], borderWidth: 0 }] }, options: opt });
    }

    function updateKPIs(data) {
        const total = data.reduce((sum, p) => sum + clean(p.Cost), 0);
        const actual = data.reduce((sum, p) => sum + clean(p.ActualCost), 0);
        const planned = data.reduce((sum, p) => sum + clean(p.PlannedValue || p['Planned Value']), 0);
        const avg = data.length ? data.reduce((sum, p) => sum + clean(p.Progress), 0) / data.length : 0;

        document.getElementById('kpi-budget').textContent = '₱' + total.toLocaleString('en-PH');
        document.getElementById('kpi-actual').textContent = '₱' + actual.toLocaleString('en-PH');
        document.getElementById('kpi-variance').textContent = '₱' + (total - actual).toLocaleString('en-PH');
        document.getElementById('kpi-progress').textContent = Math.round(avg) + '%';
        
        const ev = total * (avg / 100);
        const spi = planned > 0 ? ev / planned : 1;
        const cpi = actual > 0 ? ev / actual : 1;
        
        document.getElementById('spi-text').textContent = spi.toFixed(2);
        document.getElementById('cpi-text').textContent = cpi.toFixed(2);
        
        charts.spi.data.datasets[0].data = [spi > 1 ? 1 : spi, spi > 1 ? 0 : 1 - spi];
        charts.cpi.data.datasets[0].data = [cpi > 1 ? 1 : cpi, cpi > 1 ? 0 : 1 - cpi];
        charts.spi.update(); charts.cpi.update();
    }

    document.getElementById('searchInput').addEventListener('input', renderUI);
    init();
</script>
</body>
</html>
</component>
