<component name="canvas" id="v38-obsidian-command" type="code" title="PSHS Obsidian Command Console v38" language="html" version="38">
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PSHS-WVCIC | Obsidian Command</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #020617; color: #f8fafc; }
.dashboard-container { @apply max-w-[1700px] mx-auto px-10 py-12; }

    /* Obsidian Style KPI Cards */
    .kpi-card { @apply bg-[#1e293b] p-8 rounded-[2.5rem] border border-slate-800 shadow-2xl flex flex-col justify-between min-h-[160px] transition-all hover:border-indigo-500/50; }
    .kpi-label { @apply text-[10px] font-black text-slate-500 uppercase tracking-[0.2em] mb-2; }
    .kpi-value { @apply text-2xl font-black text-white tabular-nums tracking-tighter; }

    /* Neon Progress Card */
    .kpi-neon { @apply bg-indigo-600 text-white border-none shadow-indigo-500/20 flex-row items-center justify-between p-8; }
    .kpi-neon .kpi-value { @apply text-4xl font-extrabold italic tracking-tighter; }

    /* Dark Mode Project Cards */
    .project-card { @apply bg-[#0f172a] border border-slate-800 rounded-[3rem] overflow-hidden flex flex-col h-full transition-all duration-500 hover:shadow-indigo-500/10 hover:-translate-y-2; }
    .status-accent { @apply h-3.5 w-full; }
    .bg-completed { @apply bg-[#10b981]; }
    .bg-ongoing { @apply bg-[#f59e0b]; }
    .bg-proposed { @apply bg-[#6366f1]; }

    /* Detail Dropdowns - Dark Mode */
    .detail-trigger { @apply bg-slate-900/50 p-6 rounded-2xl border border-slate-800 mb-4 flex items-center justify-between cursor-pointer hover:bg-slate-800/50 hover:border-indigo-500/30 transition-all; }
    .task-line { @apply flex gap-4 py-4 border-b border-slate-800/50 last:border-none items-start; }
    .task-bullet { @apply w-5 h-5 rounded-full flex items-center justify-center text-[8px] font-black text-white shrink-0 mt-0.5 shadow-lg; }

    .search-field { @apply w-full pl-14 pr-6 py-5 rounded-[2rem] border border-slate-800 bg-[#0f172a] text-white shadow-inner font-bold text-sm outline-none focus:ring-4 focus:ring-indigo-500/20 focus:border-indigo-500; }
    
    details summary::-webkit-details-marker { display: none; }
    details > summary { list-style: none; }
</style>
</head>
<body>

<nav class="bg-[#020617]/80 backdrop-blur-xl border-b border-slate-800 px-10 py-7 sticky top-0 z-50">
    <div class="max-w-[1700px] mx-auto flex justify-between items-center">
        <div class="flex items-center gap-6">
            <div class="bg-indigo-600 w-12 h-12 rounded-2xl flex items-center justify-center shadow-indigo-500/40 shadow-xl"><i class="fas fa-microchip text-white text-sm"></i></div>
            <div>
                <h1 class="text-lg font-black tracking-tighter uppercase leading-none text-white">PSHS-WVCIC</h1>
                <p class="text-[10px] font-bold text-slate-500 uppercase tracking-[0.25em] mt-1.5">Infrastructure Strategic Command</p>
            </div>
        </div>
        <div class="flex items-center gap-4 bg-emerald-500/10 text-emerald-400 px-6 py-3 rounded-full border border-emerald-500/20 text-[10px] font-black uppercase tracking-widest">
            <span class="w-2.5 h-2.5 bg-emerald-500 rounded-full animate-pulse shadow-[0_0_10px_#10b981]"></span> Data Stream Active
        </div>
    </div>
</nav>

<main class="dashboard-container">
    
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-6 gap-8 mb-20">
        <div class="kpi-card border-l-4 border-l-indigo-600">
            <span class="kpi-label">Allocated Budget</span>
            <span id="kpi-budget" class="kpi-value text-white">₱0.00</span>
        </div>
        <div class="kpi-card">
            <span class="kpi-label">Expenditure</span>
            <span id="kpi-actual" class="kpi-value text-slate-300">₱0.00</span>
        </div>
        <div class="kpi-card">
            <span class="kpi-label">Variance</span>
            <span id="kpi-variance" class="kpi-value text-rose-400">₱0.00</span>
        </div>
        <div class="kpi-card kpi-neon col-span-1 shadow-2xl">
            <div>
                <span class="kpi-label text-indigo-200">Execution Progress</span>
                <div id="kpi-progress" class="kpi-value">0%</div>
            </div>
            <div class="w-14 h-14 bg-white/10 rounded-2xl flex items-center justify-center border border-white/20"><i class="fas fa-chart-line text-white text-xl"></i></div>
        </div>
        <div class="kpi-card items-center justify-center text-center">
            <span class="kpi-label mb-4">SPI (Schedule)</span>
            <div class="w-24 h-12 relative"><canvas id="gaugeSPI"></canvas></div>
            <span id="spi-text" class="text-[11px] font-black mt-3 text-indigo-400 tracking-[0.2em]">1.00</span>
        </div>
        <div class="kpi-card items-center justify-center text-center">
            <span class="kpi-label mb-4">CPI (Cost)</span>
            <div class="w-24 h-12 relative"><canvas id="gaugeCPI"></canvas></div>
            <span id="cpi-text" class="text-[11px] font-black mt-3 text-emerald-400 tracking-[0.2em]">1.00</span>
        </div>
    </div>

    <div class="flex flex-col xl:flex-row gap-8 mb-20 items-center">
        <div class="relative flex-grow w-full">
            <i class="fas fa-search absolute left-6 top-1/2 -translate-y-1/2 text-slate-600"></i>
            <input type="text" id="searchInput" placeholder="Filter by Building, Contractor, or Project..." class="search-field">
        </div>
        <select id="fyFilter" onchange="renderUI()" class="search-field w-auto min-w-[220px] bg-[#0f172a] border-slate-800 cursor-pointer text-slate-400">
            <option value="All">All Fiscal Years</option>
        </select>
    </div>

    <div id="project-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-14 pb-48">
        </div>
</main>

<script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbz-9wukcFnCwKNhcmTrTRQaY9fc_vOJA8O6yqNA71XKrJmiAj-b5f6uYzSG07JUjAcR/exec';
    let allProjects = [];
    let charts = {};

    async function init() {
        try {
            const response = await fetch(scriptURL);
            allProjects = await response.json();
            populateFYFilter();
            initCharts();
            renderUI();
        } catch (e) { console.error("Data Link Severed:", e); }
    }

    function populateFYFilter() {
        const fySelect = document.getElementById('fyFilter');
        const years = [...new Set(allProjects.map(p => p.FiscalYear).filter(y => y))].sort().reverse();
        years.forEach(year => { const opt = document.createElement('option'); opt.value = year; opt.textContent = `FY ${year}`; fySelect.appendChild(opt); });
    }

    function clean(v) {
        if (!v) return 0;
        const str = v.toString().replace(/[^\d.-]/g, '');
        const num = parseFloat(str);
        return isNaN(num) ? 0 : num;
    }

    function formatStrategicDate(dateStr) {
        if (!dateStr || dateStr === "TBD" || dateStr === "---") return "Pending Date";
        const date = new Date(dateStr);
        return isNaN(date.getTime()) ? dateStr : date.toLocaleDateString('en-PH', { month: 'short', day: '2-digit', year: 'numeric' });
    }

    function renderUI() {
        const term = document.getElementById('searchInput').value.toLowerCase();
        const fy = document.getElementById('fyFilter').value;
        const filtered = allProjects.filter(p => {
            const pool = `${p.ProjectName} ${p.Contractor} ${p.Location}`.toLowerCase();
            return pool.includes(term) && (fy === 'All' || p.FiscalYear === fy);
        });
        renderCards(filtered);
        updateKPIs(filtered);
    }

    function renderCards(projects) {
        const grid = document.getElementById('project-grid');
        grid.innerHTML = projects.length ? '' : '<div class="col-span-full py-40 text-center opacity-10 font-black uppercase text-xs tracking-[0.5em]">No Strategic Data</div>';

        projects.forEach(p => {
            const accent = p.Status === 'Completed' ? 'bg-completed' : (p.Status === 'In Progress' ? 'bg-ongoing' : 'bg-proposed');
            const badge = p.Status === 'Completed' ? 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20' : (p.Status === 'In Progress' ? 'bg-amber-500/10 text-amber-400 border-amber-500/20' : 'bg-indigo-500/10 text-indigo-400 border-indigo-500/20');
            const cost = '₱' + clean(p.Cost).toLocaleString('en-PH', {minimumFractionDigits: 2});
            
            const listParser = (str, color) => {
                if (!str || str === "---") return '<p class="text-[10px] text-slate-600 italic">No details found</p>';
                return str.split(/[;\n]/).filter(x => x.trim()).map((item, i) => {
                    const isDone = p.Status === 'Completed';
                    return `<div class="task-line"><span class="task-bullet ${isDone ? 'bg-emerald-500' : color} shadow-inner">${isDone ? '<i class="fas fa-check"></i>' : i + 1}</span><span class="text-[11px] font-bold text-slate-400 leading-relaxed">${item.trim()}</span></div>`;
                }).join('');
            };

            grid.innerHTML += `
                <div class="project-card shadow-2xl">
                    <div class="status-accent ${accent}"></div>
                    <div class="p-10 flex flex-col h-full">
                        <div class="flex justify-between items-center mb-10">
                            <span class="badge px-4 py-1.5 rounded-full text-[9px] font-black uppercase border tracking-widest">${p.Status}</span>
                            <span class="text-[10px] font-black text-slate-600 uppercase tracking-widest">${p.FiscalYear || 'FY --'}</span>
                        </div>
                        
                        <div class="flex flex-wrap gap-2 mb-6">
                            ${(p.Location || "Main").split(';').map(l => `<span class="bg-slate-800 text-slate-500 px-3 py-1 rounded-lg text-[8px] font-black uppercase tracking-widest">${l.trim()}</span>`).join('')}
                        </div>

                        <h3 class="text-2xl font-black leading-tight uppercase mb-12 min-h-[5.5rem] text-white tracking-tight italic">${p.ProjectName}</h3>
                        
                        <details class="group"><summary class="detail-trigger"><span class="text-[10px] font-black text-slate-500 uppercase tracking-widest"><i class="fas fa-tasks mr-3 text-indigo-500"></i> Scope of Works</span><i class="fas fa-chevron-down text-[8px] group-open:rotate-180 transition-transform text-slate-600"></i></summary><div class="mb-10 px-2">${listParser(p.Scope, 'bg-indigo-600')}</div></details>
                        <details class="group"><summary class="detail-trigger"><span class="text-[10px] font-black text-slate-500 uppercase tracking-widest"><i class="fas fa-comment-dots mr-3 text-slate-500"></i> Admin Remarks</span><i class="fas fa-chevron-down text-[8px] group-open:rotate-180 transition-transform text-slate-600"></i></summary><div class="mb-10 px-2">${listParser(p.Notes, 'bg-slate-600')}</div></details>

                        <div class="mt-auto pt-12 border-t border-slate-800">
                            <div class="grid grid-cols-2 gap-4 mb-10">
                                <div><p class="text-[9px] font-black text-slate-500 uppercase mb-2 tracking-widest">Target End</p><p class="text-[11px] font-black text-white">${formatStrategicDate(p.TargetDate)}</p></div>
                                <div class="text-right"><p class="text-[9px] font-black text-slate-500 uppercase mb-2 tracking-widest">Project Value</p><p class="text-xs font-black text-white tabular-nums">${cost}</p></div>
                            </div>
                            ${p.AttachmentURL ? `<a href="${p.AttachmentURL}" target="_blank" class="w-full py-5 bg-white text-slate-900 rounded-3xl text-[10px] font-black uppercase tracking-[0.4em] flex items-center justify-center gap-4 hover:bg-indigo-500 hover:text-white transition-all shadow-xl"><i class="fas fa-file-contract"></i> Record Vault</a>` : `<div class="w-full py-5 bg-slate-800/50 text-slate-600 rounded-3xl text-[10px] font-black uppercase text-center tracking-widest italic border border-slate-800">Awaiting Assets</div>`}
                            <div class="mt-12">
                                <div class="flex justify-between items-center text-[10px] font-black text-slate-600 uppercase tracking-widest mb-4"><span>Physical Execution</span><span class="text-indigo-400 italic font-black">${p.Progress || 0}%</span></div>
                                <div class="w-full bg-slate-800 h-2 rounded-full overflow-hidden shadow-inner"><div class="bg-indigo-600 h-full transition-all duration-1000 shadow-[0_0_10px_#6366f1]" style="width: ${p.Progress || 0}%"></div></div>
                            </div>
                        </div>
                    </div>
                </div>`;
        });
    }

    function initCharts() {
        const opt = { cutout: '80%', circumfrence: 180, rotation: 270, plugins: { legend: { display: false } }, responsive: true, maintainAspectRatio: false };
        charts.spi = new Chart(document.getElementById('gaugeSPI'), { type: 'doughnut', data: { datasets: [{ data: [0.5, 0.5], backgroundColor: ['#6366f1', '#1e293b'], borderWidth: 0 }] }, options: opt });
        charts.cpi = new Chart(document.getElementById('gaugeCPI'), { type: 'doughnut', data: { datasets: [{ data: [0.5, 0.5], backgroundColor: ['#10b981', '#1e293b'], borderWidth: 0 }] }, options: opt });
    }

    function updateKPIs(data) {
        const budget = data.reduce((sum, p) => sum + clean(p.Cost), 0);
        const actual = data.reduce((sum, p) => sum + clean(p.ActualCost), 0);
        const planned = data.reduce((sum, p) => sum + clean(p.PlannedValue || p['Planned Value']), 0);
        const avg = data.length ? data.reduce((sum, p) => sum + clean(p.Progress), 0) / data.length : 0;

        document.getElementById('kpi-budget').textContent = '₱' + budget.toLocaleString('en-PH');
        document.getElementById('kpi-actual').textContent = '₱' + actual.toLocaleString('en-PH');
        document.getElementById('kpi-variance').textContent = '₱' + (budget - actual).toLocaleString('en-PH');
        document.getElementById('kpi-progress').textContent = Math.round(avg) + '%';
        
        const ev = budget * (avg / 100);
        const spi = planned > 0 ? ev / planned : 1;
        const cpi = actual > 0 ? ev / actual : 1;
        
        document.getElementById('spi-text').textContent = spi.toFixed(2);
        document.getElementById('cpi-text').textContent = cpi.toFixed(2);
        
        charts.spi.data.datasets[0].data = [spi > 1 ? 1 : spi, spi > 1 ? 0 : 1 - spi];
        charts.cpi.data.datasets[0].data = [cpi > 1 ? 1 : cpi, cpi > 1 ? 0 : 1 - cpi];
        charts.spi.update(); charts.cpi.update();
    }

    document.getElementById('searchInput').addEventListener('input', renderUI);
    init();
</script>
</body>
</html>
</component>
