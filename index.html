<component name="canvas" id="v39-space-black-clean" type="code" title="PSHS Space Black Console v39 - Clean Layout" language="html" version="39">
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PSHS-WVCIC | Space Black Command</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #05070a; color: #f1f5f9; }
.dashboard-container { @apply max-w-[1700px] mx-auto px-12 py-12; }

    /* Metric Grid Fix - Zero Overlap */
    .metric-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1.5rem; margin-bottom: 3rem; }
    .metric-card { @apply bg-[#0f1117] p-8 rounded-[2.5rem] border border-white/5 shadow-2xl flex flex-col justify-center min-h-[160px] transition-transform hover:scale-[1.02]; }
    .metric-label { @apply text-[10px] font-black text-slate-500 uppercase tracking-[0.2em] mb-3; }
    .metric-value { @apply text-2xl font-black text-white tabular-nums tracking-tighter; }
    
    /* Neon Highlight for Portfolio */
    .metric-highlight { @apply bg-indigo-600 border-none ring-8 ring-indigo-600/10; }

    /* Project Cards - Cleaned Up */
    .project-card { @apply bg-[#0f1117] border border-white/5 rounded-[3rem] overflow-hidden flex flex-col h-full transition-all duration-500 hover:shadow-indigo-500/10 hover:border-white/10; }
    .status-accent { @apply h-3 w-full; }
    .bg-completed { @apply bg-[#10b981]; }
    .bg-ongoing { @apply bg-[#f59e0b]; }
    .bg-proposed { @apply bg-[#334155]; }

    /* Detail Elements - Reference Fix for image_3d587f */
    .detail-trigger { @apply bg-white/5 p-6 rounded-2xl border border-white/5 mb-4 flex items-center justify-between cursor-pointer hover:bg-white/10 transition-all; }
    .task-row { @apply flex gap-4 py-4 border-b border-white/5 last:border-none items-start; }
    .task-check { @apply w-5 h-5 rounded-full flex items-center justify-center text-[8px] font-black text-white shrink-0 mt-0.5; }

    .search-field { @apply w-full pl-14 pr-6 py-5 rounded-[2.2rem] border border-white/10 bg-[#0f1117] text-white font-bold text-sm outline-none focus:ring-4 focus:ring-indigo-500/20 focus:border-indigo-500/50; }
    
    details summary::-webkit-details-marker { display: none; }
    details > summary { list-style: none; }
</style>
</head>
<body>

<nav class="bg-[#05070a]/90 backdrop-blur-2xl border-b border-white/5 px-12 py-8 sticky top-0 z-50">
    <div class="max-w-[1700px] mx-auto flex justify-between items-center">
        <div class="flex items-center gap-6">
            <div class="bg-indigo-600 w-12 h-12 rounded-2xl flex items-center justify-center shadow-indigo-600/40 shadow-2xl"><i class="fas fa-layer-group text-white text-sm"></i></div>
            <div>
                <h1 class="text-xl font-black tracking-tighter uppercase leading-none text-white">PSHS-WVCIC</h1>
                <p class="text-[10px] font-bold text-slate-500 uppercase tracking-[0.3em] mt-2">Executive Infrastructure Hub</p>
            </div>
        </div>
        <div class="flex items-center gap-3 bg-emerald-500/5 text-emerald-400 px-6 py-3 rounded-full border border-emerald-500/10 text-[10px] font-black uppercase tracking-widest">
            <span class="w-2 h-2 bg-emerald-500 rounded-full animate-pulse"></span> Terminal Secure
        </div>
    </div>
</nav>

<main class="dashboard-container">
    
    <div class="metric-grid">
        <div class="metric-card border-l-4 border-l-indigo-600">
            <span class="metric-label">Allocated Budget</span>
            <span id="kpi-budget" class="metric-value">₱0.00</span>
        </div>
        <div class="metric-card">
            <span class="metric-label">Actual Expenditure</span>
            <span id="kpi-actual" class="metric-value text-slate-400">₱0.00</span>
        </div>
        <div class="metric-card">
            <span class="metric-label">Financial Variance</span>
            <span id="kpi-variance" class="metric-value text-rose-400">₱0.00</span>
        </div>
        <div class="metric-card metric-highlight">
            <span class="metric-label text-indigo-200">Portfolio Progress</span>
            <span id="kpi-progress" class="text-4xl font-black italic text-white tracking-tighter">0%</span>
        </div>
        <div class="metric-card items-center justify-center text-center">
            <span class="metric-label mb-4">SPI (Schedule)</span>
            <div class="w-24 h-12 relative"><canvas id="gaugeSPI"></canvas></div>
            <span id="spi-text" class="text-[11px] font-black mt-3 text-indigo-400 tracking-widest">1.00</span>
        </div>
        <div class="metric-card items-center justify-center text-center">
            <span class="metric-label mb-4">CPI (Cost)</span>
            <div class="w-24 h-12 relative"><canvas id="gaugeCPI"></canvas></div>
            <span id="cpi-text" class="text-[11px] font-black mt-3 text-emerald-400 tracking-widest">1.00</span>
        </div>
    </div>

    <div class="flex flex-col xl:flex-row gap-8 mb-20 items-center">
        <div class="relative flex-grow w-full">
            <i class="fas fa-search absolute left-6 top-1/2 -translate-y-1/2 text-slate-700"></i>
            <input type="text" id="searchInput" placeholder="Search by Project, Building, or Category..." class="search-field">
        </div>
        <select id="fyFilter" onchange="renderUI()" class="search-field w-auto min-w-[240px] bg-[#0f1117] border-white/10 cursor-pointer text-slate-400">
            <option value="All">All Fiscal Years</option>
        </select>
    </div>

    <div id="project-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-16 pb-48"></div>
</main>

<script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbz-9wukcFnCwKNhcmTrTRQaY9fc_vOJA8O6yqNA71XKrJmiAj-b5f6uYzSG07JUjAcR/exec';
    let allProjects = [];
    let charts = {};

    async function init() {
        try {
            const response = await fetch(scriptURL);
            allProjects = await response.json();
            populateFYFilter();
            initCharts();
            renderUI();
        } catch (e) { console.error("Sync Failure:", e); }
    }

    function populateFYFilter() {
        const fySelect = document.getElementById('fyFilter');
        const years = [...new Set(allProjects.map(p => p.FiscalYear).filter(y => y))].sort().reverse();
        years.forEach(year => { const opt = document.createElement('option'); opt.value = year; opt.textContent = `FY ${year}`; fySelect.appendChild(opt); });
    }

    function clean(v) {
        if (!v) return 0;
        const str = v.toString().replace(/[^\d.-]/g, '');
        const num = parseFloat(str);
        return isNaN(num) ? 0 : num;
    }

    function formatStrategicDate(dateStr) {
        if (!dateStr || dateStr === "TBD" || dateStr === "---") return "Pending Date";
        const date = new Date(dateStr);
        return isNaN(date.getTime()) ? dateStr : date.toLocaleDateString('en-PH', { month: 'short', day: '2-digit', year: 'numeric' });
    }

    function renderUI() {
        const term = document.getElementById('searchInput').value.toLowerCase();
        const fy = document.getElementById('fyFilter').value;
        const filtered = allProjects.filter(p => {
            const searchPool = `${p.ProjectName} ${p.Contractor} ${p.Location}`.toLowerCase();
            return searchPool.includes(term) && (fy === 'All' || p.FiscalYear === fy);
        });
        renderCards(filtered);
        updateKPIs(filtered);
    }

    function renderCards(projects) {
        const grid = document.getElementById('project-grid');
        grid.innerHTML = projects.length ? '' : '<div class="col-span-full py-40 text-center opacity-10 font-black uppercase text-xs tracking-[0.6em]">System Standby</div>';

        projects.forEach(p => {
            const accent = p.Status === 'Completed' ? 'bg-completed' : (p.Status === 'In Progress' ? 'bg-ongoing' : 'bg-proposed');
            const badge = p.Status === 'Completed' ? 'bg-emerald-500/10 text-emerald-400' : (p.Status === 'In Progress' ? 'bg-amber-500/10 text-amber-400' : 'bg-slate-700/30 text-slate-500');
            const cost = '₱' + clean(p.Cost).toLocaleString('en-PH', {minimumFractionDigits: 2});
            
            const listParser = (str, color) => {
                if (!str || str === "---") return '<p class="text-[11px] text-slate-700 italic">No specifics registered</p>';
                return str.split(/[;\n]/).filter(x => x.trim()).map((item, i) => {
                    const isDone = p.Status === 'Completed';
                    return `<div class="task-row"><span class="task-check ${isDone ? 'bg-emerald-500' : color} shadow-lg">${isDone ? '✓' : i + 1}</span><span class="text-[12px] font-bold text-slate-400 leading-relaxed">${item.trim()}</span></div>`;
                }).join('');
            };

            grid.innerHTML += `
                <div class="project-card">
                    <div class="status-accent ${accent}"></div>
                    <div class="p-12 flex flex-col h-full">
                        <div class="flex justify-between items-center mb-10">
                            <span class="badge px-4 py-1.5 rounded-full text-[9px] font-black uppercase tracking-[0.15em] border border-white/5">${p.Status}</span>
                            <span class="text-[10px] font-black text-slate-700 uppercase tracking-widest">${p.FiscalYear || 'FY --'}</span>
                        </div>
                        
                        <div class="flex flex-wrap gap-2 mb-8">
                            ${(p.Location || "Main").split(';').map(l => `<span class="bg-white/5 text-slate-600 px-3 py-1.5 rounded-xl text-[9px] font-black uppercase tracking-widest">${l.trim()}</span>`).join('')}
                        </div>

                        <h3 class="text-2xl font-black leading-tight uppercase mb-12 min-h-[6rem] text-white tracking-tight">${p.ProjectName}</h3>
                        
                        <details class="group"><summary class="detail-trigger"><span class="text-[10px] font-black text-slate-500 uppercase tracking-widest"><i class="fas fa-list-ul mr-3 text-indigo-500"></i> Scope of Works</span><i class="fas fa-chevron-down text-[10px] group-open:rotate-180 transition-all text-slate-700"></i></summary><div class="mb-10 px-2">${listParser(p.Scope, 'bg-indigo-600')}</div></details>
                        <details class="group"><summary class="detail-trigger"><span class="text-[10px] font-black text-slate-500 uppercase tracking-widest"><i class="fas fa-info-circle mr-3 text-slate-700"></i> Admin Remarks</span><i class="fas fa-chevron-down text-[10px] group-open:rotate-180 transition-all text-slate-700"></i></summary><div class="mb-10 px-2">${listParser(p.Notes, 'bg-slate-700')}</div></details>

                        <div class="mt-auto pt-12 border-t border-white/5">
                            <div class="grid grid-cols-2 gap-4 mb-10">
                                <div><p class="text-[10px] font-black text-slate-600 uppercase mb-2 tracking-widest">Target Date</p><p class="text-xs font-black text-white">${formatStrategicDate(p.TargetDate)}</p></div>
                                <div class="text-right"><p class="text-[10px] font-black text-slate-600 uppercase mb-2 tracking-widest">Contract Value</p><p class="text-sm font-black text-white tabular-nums">${cost}</p></div>
                            </div>
                            ${p.AttachmentURL ? `<a href="${p.AttachmentURL}" target="_blank" class="w-full py-5 bg-white text-slate-900 rounded-3xl text-[10px] font-black uppercase tracking-[0.4em] flex items-center justify-center gap-4 hover:bg-indigo-600 hover:text-white transition-all shadow-2xl"><i class="fas fa-file-pdf"></i> Access Archives</a>` : `<div class="w-full py-5 bg-white/5 text-slate-700 rounded-3xl text-[10px] font-black uppercase text-center tracking-widest italic border border-white/5">Awaiting Documentation</div>`}
                            <div class="mt-12">
                                <div class="flex justify-between items-center text-[10px] font-black text-slate-700 uppercase tracking-widest mb-4"><span>Physical Execution</span><span class="text-indigo-400 font-black">${p.Progress || 0}%</span></div>
                                <div class="w-full bg-white/5 h-2 rounded-full overflow-hidden"><div class="bg-indigo-600 h-full transition-all duration-1000 shadow-[0_0_15px_#6366f1]" style="width: ${p.Progress || 0}%"></div></div>
                            </div>
                        </div>
                    </div>
                </div>`;
        });
    }

    function initCharts() {
        const opt = { cutout: '82%', circumfrence: 180, rotation: 270, plugins: { legend: { display: false } }, responsive: true, maintainAspectRatio: false };
        charts.spi = new Chart(document.getElementById('gaugeSPI'), { type: 'doughnut', data: { datasets: [{ data: [0.5, 0.5], backgroundColor: ['#6366f1', '#1e293b'], borderWidth: 0 }] }, options: opt });
        charts.cpi = new Chart(document.getElementById('gaugeCPI'), { type: 'doughnut', data: { datasets: [{ data: [0.5, 0.5], backgroundColor: ['#10b981', '#1e293b'], borderWidth: 0 }] }, options: opt });
    }

    function updateKPIs(data) {
        const budget = data.reduce((sum, p) => sum + clean(p.Cost), 0);
        const actual = data.reduce((sum, p) => sum + clean(p.ActualCost), 0);
        const planned = data.reduce((sum, p) => sum + clean(p.PlannedValue || p['Planned Value']), 0);
        const avg = data.length ? data.reduce((sum, p) => sum + clean(p.Progress), 0) / data.length : 0;

        document.getElementById('kpi-budget').textContent = '₱' + budget.toLocaleString('en-PH');
        document.getElementById('kpi-actual').textContent = '₱' + actual.toLocaleString('en-PH');
        document.getElementById('kpi-variance').textContent = '₱' + (budget - actual).toLocaleString('en-PH');
        document.getElementById('kpi-progress').textContent = Math.round(avg) + '%';
        
        const ev = budget * (avg / 100);
        const spi = planned > 0 ? ev / planned : 1;
        const cpi = actual > 0 ? ev / actual : 1;
        
        document.getElementById('spi-text').textContent = spi.toFixed(2);
        document.getElementById('cpi-text').textContent = cpi.toFixed(2);
        
        charts.spi.data.datasets[0].data = [spi > 1 ? 1 : spi, spi > 1 ? 0 : 1 - spi];
        charts.cpi.data.datasets[0].data = [cpi > 1 ? 1 : cpi, cpi > 1 ? 0 : 1 - cpi];
        charts.spi.update(); charts.cpi.update();
    }

    document.getElementById('searchInput').addEventListener('input', renderUI);
    init();
</script>
</body>
</html>
</component>
