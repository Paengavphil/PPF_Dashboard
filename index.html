<component name="canvas" id="v71-institutional-precision" type="code" title="PSHS Executive Terminal v71 - Balanced & Tight Build" language="html" version="71">
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PSHS-WVCIC | Institutional Strategy Hub</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root { --bg: #020617; --card: #0f172a; --accent: #6366f1; }
body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: var(--bg); color: #f1f5f9; letter-spacing: -0.02em; }
.dashboard-container { @apply max-w-[1750px] mx-auto px-8 py-6; }

    /* PRIMARY HIGH-IMPACT CARDS (Allocation, Exp, Var, Exec) */
    .kpi-main-card { @apply bg-[#0f172a] p-8 rounded-[2rem] border border-slate-800/50 shadow-2xl flex flex-col justify-center min-h-[160px] transition-all hover:border-indigo-500/30; }
    .kpi-label { @apply text-[10px] font-black text-slate-500 uppercase tracking-[0.3em] mb-1; }
    .kpi-value-big { @apply text-3xl lg:text-4xl font-black text-white tabular-nums tracking-tighter leading-none; }
    
    /* EXECUTION HERO CARD */
    .kpi-hero { @apply bg-indigo-600 border-none shadow-indigo-600/20 ring-1 ring-white/10; }
    .kpi-hero .kpi-value-big { @apply text-5xl font-extrabold italic; }

    /* SECONDARY KPI CARDS (SPI, CPI) */
    .kpi-sub-card { @apply bg-[#0f172a]/40 p-5 rounded-[1.5rem] border border-slate-800/40 flex flex-col items-center justify-center text-center transition-all hover:bg-[#0f172a]; }
    .kpi-value-sub { @apply text-2xl font-black tabular-nums tracking-tighter text-indigo-400 mt-1; }

    /* Project Cards - Tightened Spacing */
    .project-card { @apply bg-[#0f172a] border border-slate-800/60 rounded-[2.5rem] overflow-hidden flex flex-col h-full transition-all duration-500; }
    .status-accent { @apply h-2.5 w-full; }
    .bg-completed { @apply bg-emerald-500; }
    .bg-ongoing { @apply bg-amber-500; }
    .bg-proposed { @apply bg-slate-700; }

    /* Compact Dropbars */
    .detail-bar { @apply bg-slate-900/40 px-6 py-4 rounded-xl border border-slate-800 mb-3 cursor-pointer hover:bg-slate-800/60 transition-all block; }
    .summary-flex { display: flex; justify-content: space-between; align-items: center; width: 100%; }
    .chevron-icon { @apply text-[12px] text-slate-600 transition-transform duration-300; }
    details[open] .chevron-icon { transform: rotate(90deg); color: #6366f1; }

    /* LISTS - Tightened rows to remove "Floating" feel */
    .list-row { @apply flex gap-3 py-2 border-b border-slate-800/20 last:border-none items-start; }
    .list-number { @apply text-[12px] font-black text-indigo-400 min-w-[22px] mt-0.5; }
    .list-text { @apply text-[13px] font-medium text-slate-400 leading-snug; }

    /* Compact Search Hub */
    .search-hub { @apply w-full pl-14 pr-6 py-5 rounded-2xl border border-slate-800 bg-[#0f172a] text-white font-bold text-sm outline-none focus:ring-4 focus:ring-indigo-500/10 focus:border-indigo-500/40 transition-all; }
    
    details summary::-webkit-details-marker { display: none; }
    details > summary { list-style: none; outline: none; }
</style>
</head>
<body>

<nav class="bg-[#020617]/95 backdrop-blur-3xl border-b border-slate-800/50 px-8 py-6 sticky top-0 z-50">
    <div class="max-w-[1750px] mx-auto flex justify-between items-center">
        <div class="flex items-center gap-5">
            <div class="bg-indigo-600 w-10 h-10 rounded-xl flex items-center justify-center shadow-lg border border-white/10"><i class="fas fa-layer-group text-white text-base"></i></div>
            <div>
                <h1 class="text-xl font-black tracking-tighter uppercase leading-none text-white">PSHS-WVCIC</h1>
                <p class="text-[10px] font-bold text-slate-500 uppercase tracking-[0.3em] mt-1 text-indigo-400/80">Strategy Terminal v71</p>
            </div>
        </div>
        <div class="flex items-center gap-2 bg-emerald-500/5 text-emerald-400 px-5 py-2 rounded-full border border-emerald-500/10 text-[10px] font-black uppercase tracking-widest">
            <span class="w-2 h-2 bg-emerald-500 rounded-full animate-pulse shadow-[0_0_8px_#10b981]"></span> Live Node Verified
        </div>
    </div>
</nav>

<main class="dashboard-container">
    
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 xl:grid-cols-6 gap-6 mb-12">
        
        <div class="kpi-main-card border-l-4 border-l-indigo-500">
            <span class="kpi-label">Allocation</span>
            <span id="kpi-budget" class="kpi-value-big">₱0.00</span>
        </div>
        
        <div class="kpi-main-card border-l-4 border-l-slate-700">
            <span class="kpi-label">Expenditure</span>
            <span id="kpi-actual" class="kpi-value-big text-slate-400">₱0.00</span>
        </div>
        
        <div class="kpi-main-card border-l-4 border-l-rose-600">
            <span class="kpi-label">Variance</span>
            <span id="kpi-variance" class="kpi-value-big text-rose-500">₱0.00</span>
        </div>

        <div class="kpi-main-card kpi-hero">
            <span class="kpi-label text-indigo-100">Execution</span>
            <span id="kpi-progress" class="kpi-value-big">0%</span>
        </div>

        <div class="kpi-sub-card">
            <span class="kpi-label mb-1">SPI</span>
            <div class="w-20 h-10 relative"><canvas id="gaugeSPI"></canvas></div>
            <span id="spi-text" class="kpi-value-sub">1.00</span>
        </div>

        <div class="kpi-sub-card">
            <span class="kpi-label mb-1">CPI</span>
            <div class="w-20 h-10 relative"><canvas id="gaugeCPI"></canvas></div>
            <span id="cpi-text" class="kpi-value-sub text-emerald-400">1.00</span>
        </div>
    </div>

    <div class="flex flex-col xl:flex-row gap-6 mb-12 items-center">
        <div class="relative flex-grow w-full">
            <i class="fas fa-search absolute left-6 top-1/2 -translate-y-1/2 text-slate-700"></i>
            <input type="text" id="searchInput" placeholder="Search Milestone Records..." class="search-hub">
        </div>
        <select id="fyFilter" onchange="renderUI()" class="search-hub w-auto min-w-[200px] bg-[#0f172a] border-slate-800 text-slate-400 cursor-pointer"></select>
    </div>

    <div id="project-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8 pb-32"></div>
</main>

<script>
    // PROTECTED URL - ZERO EDIT REQUIRED (v71)
    const scriptURL = `https\u003A//script.google.com/macros/s/AKfycbz-9wukcFnCwKNhcmTrTRQaY9fc_vOJA8O6yqNA71XKrJmiAj-b5f6uYzSG07JUjAcR/exec`;
    
    let allProjects = [];
    let charts = {};

    async function init() {
        try {
            const response = await fetch(scriptURL);
            allProjects = await response.json();
            populateFYFilter();
            initCharts();
            renderUI();
        } catch (e) { console.error("Sync Failure:", e); }
    }

    function populateFYFilter() {
        const fySelect = document.getElementById('fyFilter');
        const years = [...new Set(allProjects.map(p => p.FiscalYear).filter(y => y))].sort().reverse();
        fySelect.innerHTML = '<option value="All">All Years</option>' + years.map(y => `<option value="${y}">FY ${y}</option>`).join('');
    }

    function clean(v) {
        if (!v) return 0;
        const str = v.toString().replace(/[^\d.-]/g, '');
        const num = parseFloat(str);
        return isNaN(num) ? 0 : num;
    }

    function renderUI() {
        const term = document.getElementById('searchInput').value.toLowerCase();
        const fy = document.getElementById('fyFilter').value;
        const filtered = allProjects.filter(p => {
            const pool = `${p.ProjectName} ${p.Contractor} ${p.Location}`.toLowerCase();
            return pool.includes(term) && (fy === 'All' || p.FiscalYear === fy);
        });
        renderCards(filtered);
        updateKPIs(filtered);
    }

    function renderCards(projects) {
        const grid = document.getElementById('project-grid');
        grid.innerHTML = projects.length ? '' : '<div class="col-span-full py-20 text-center opacity-10 font-black uppercase text-[10px] tracking-[0.5em]">Scanning Node</div>';

        projects.forEach(p => {
            const accent = p.Status === 'Completed' ? 'bg-completed' : (p.Status === 'In Progress' ? 'bg-ongoing' : 'bg-slate-700');
            const badgeStyle = p.Status === 'Completed' ? 'bg-emerald-500/10 text-emerald-400' : (p.Status === 'In Progress' ? 'bg-amber-500/10 text-amber-400' : 'bg-gray-800/50 text-gray-500');
            const cost = '₱' + clean(p.Cost).toLocaleString('en-PH', {minimumFractionDigits: 2});
            
            const listParser = (str) => {
                if (!str || str === "---") return '<p class="text-[11px] text-slate-600 italic px-2">No records found</p>';
                return str.split(/[;\n]/).filter(x => x.trim()).map((item, index) => {
                    return `<div class="list-row"><span class="list-number">${index + 1}.</span><span class="list-text">${item.trim()}</span></div>`;
                }).join('');
            };

            grid.innerHTML += `
                <div class="project-card shadow-lg">
                    <div class="status-accent ${accent}"></div>
                    <div class="p-8 flex flex-col h-full">
                        <div class="flex justify-between items-center mb-6">
                            <span class="px-3 py-1 rounded-full text-[8px] font-black uppercase tracking-[0.1em] border border-white/5 ${badgeStyle}">${p.Status}</span>
                            <span class="text-[9px] font-black text-slate-700 uppercase tracking-widest">${p.FiscalYear || 'FY --'}</span>
                        </div>
                        <h3 class="text-xl font-black leading-tight uppercase mb-8 min-h-[5rem] text-white tracking-tight italic">${p.ProjectName}</h3>
                        
                        <details class="group"><summary class="detail-bar"><div class="summary-flex"><span class="text-[14px] font-black text-slate-400 uppercase tracking-wider flex items-center"><i class="fas fa-drafting-compass mr-4 text-indigo-500 text-xs"></i> Scope of Works</span><span class="chevron-icon"><i class="fas fa-chevron-right"></i></span></div></summary><div class="mb-4 px-1">${listParser(p.Scope)}</div></details>
                        <details class="group"><summary class="detail-bar"><div class="summary-flex"><span class="text-[14px] font-black text-slate-400 uppercase tracking-wider flex items-center"><i class="fas fa-pen-nib mr-4 text-slate-600 text-xs"></i> Admin Remarks</span><span class="chevron-icon"><i class="fas fa-chevron-right"></i></span></div></summary><div class="mb-4 px-1">${listParser(p.Notes)}</div></details>

                        <div class="mt-auto pt-8 border-t border-slate-800">
                            <div class="grid grid-cols-2 gap-4 mb-8">
                                <div><p class="text-[9px] font-black text-slate-600 uppercase mb-1 tracking-widest">Finish</p><p class="text-[10px] font-black text-white">${p.TargetDate || '---'}</p></div>
                                <div class="text-right"><p class="text-[9px] font-black text-slate-600 uppercase mb-1 tracking-widest">Value</p><p class="text-[11px] font-black text-white tabular-nums">${cost}</p></div>
                            </div>
                            ${p.AttachmentURL ? `<a href="${p.AttachmentURL}" target="_blank" class="w-full py-4 bg-white text-[#030712] rounded-xl text-[9px] font-black uppercase tracking-[0.3em] flex items-center justify-center gap-3 hover:bg-indigo-600 hover:text-white transition-all shadow-md"><i class="fas fa-file-contract"></i> Record Vault</a>` : `<div class="w-full py-4 bg-gray-800/30 text-slate-700 rounded-xl text-[9px] font-black uppercase text-center tracking-widest italic border border-slate-800/30">Archives Offline</div>`}
                            <div class="mt-8">
                                <div class="flex justify-between items-center text-[9px] font-black text-slate-700 uppercase tracking-widest mb-3"><span>Progress</span><span class="text-indigo-400 font-black">${p.Progress || 0}%</span></div>
                                <div class="w-full bg-slate-800 h-2 rounded-full overflow-hidden shadow-inner"><div class="bg-indigo-600 h-full transition-all duration-1000 shadow-[0_0_15px_#6366f1]" style="width: ${p.Progress || 0}%"></div></div>
                            </div>
                        </div>
                    </div>
                </div>`;
        });
    }

    function initCharts() {
        const opt = { cutout: '82%', circumfrence: 180, rotation: 270, plugins: { legend: { display: false } }, responsive: true, maintainAspectRatio: false };
        charts.spi = new Chart(document.getElementById('gaugeSPI'), { type: 'doughnut', data: { datasets: [{ data: [0.5, 0.5], backgroundColor: ['#6366f1', '#1f2937'], borderWidth: 0 }] }, options: opt });
        charts.cpi = new Chart(document.getElementById('gaugeCPI'), { type: 'doughnut', data: { datasets: [{ data: [0.5, 0.5], backgroundColor: ['#10b981', '#1f2937'], borderWidth: 0 }] }, options: opt });
    }

    function updateKPIs(data) {
        const total = data.reduce((sum, p) => sum + clean(p.Cost), 0);
        const actual = data.reduce((sum, p) => sum + clean(p.ActualCost), 0);
        const planned = data.reduce((sum, p) => sum + clean(p.PlannedValue || p['Planned Value']), 0);
        const avg = data.length ? data.reduce((sum, p) => sum + clean(p.Progress), 0) / data.length : 0;
        document.getElementById('kpi-budget').textContent = '₱' + total.toLocaleString('en-PH');
        document.getElementById('kpi-actual').textContent = '₱' + actual.toLocaleString('en-PH');
        document.getElementById('kpi-variance').textContent = '₱' + (total - actual).toLocaleString('en-PH');
        document.getElementById('kpi-progress').textContent = Math.round(avg) + '%';
        const ev = total * (avg / 100);
        const spi = planned > 0 ? ev / planned : 1;
        const cpi = actual > 0 ? ev / actual : 1;
        document.getElementById('spi-text').textContent = spi.toFixed(2);
        document.getElementById('cpi-text').textContent = cpi.toFixed(2);
        charts.spi.data.datasets[0].data = [spi > 1 ? 1 : spi, spi > 1 ? 0 : 1 - spi];
        charts.cpi.data.datasets[0].data = [cpi > 1 ? 1 : cpi, cpi > 1 ? 0 : 1 - cpi];
        charts.spi.update(); charts.cpi.update();
    }

    document.getElementById('searchInput').addEventListener('input', renderUI);
    init();
</script>
</body>
</html>
</component>
