<component name="canvas" id="v45-obsidian-executive-pro" type="code" title="PSHS Obsidian Executive Pro v45" language="html" version="45">
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PSHS-WVCIC | Executive Terminal</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root { --bg: #020617; --card: #0f172a; --accent: #6366f1; --success: #10b981; }
body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: var(--bg); color: #f1f5f9; letter-spacing: -0.01em; }
.dashboard-container { @apply max-w-[1800px] mx-auto px-12 py-16; }

    /* KPI Tiles */
    .kpi-tile { @apply bg-[#0f172a] p-10 rounded-[3rem] border border-slate-800/50 shadow-2xl flex flex-col justify-between min-h-[180px] transition-all hover:border-indigo-500/30; }
    .kpi-label { @apply text-[10px] font-black text-slate-500 uppercase tracking-[0.4em] mb-3; }
    .kpi-value { @apply text-3xl font-black text-white tabular-nums tracking-tighter; }
    
    .kpi-active { @apply bg-indigo-600 border-none shadow-indigo-600/20 ring-1 ring-white/10; }
    .kpi-active .kpi-value { @apply text-5xl italic font-extrabold; }

    /* Infrastructure Card - Deep Breathing Room (Ref: image_92dd08) */
    .project-card { @apply bg-[#0f172a] border border-slate-800/60 rounded-[4rem] overflow-hidden flex flex-col h-full transition-all duration-700 hover:shadow-indigo-500/10 hover:-translate-y-3; }
    .status-accent { @apply h-4 w-full; }
    .bg-completed { @apply bg-emerald-500; }
    .bg-ongoing { @apply bg-amber-500; }
    .bg-proposed { @apply bg-slate-700; }

    /* DROPDOWN BAR & ROTATING CHEVRON FIX */
    .detail-bar { @apply bg-slate-900/40 p-7 rounded-[2rem] border border-slate-800 mb-6 flex items-center justify-between cursor-pointer hover:bg-slate-800/60 transition-all; }
    .chevron-icon { @apply text-[11px] text-slate-600 transition-transform duration-500 ease-in-out; }
    details[open] .chevron-icon { transform: rotate(90deg); color: #6366f1; }

    /* MINIMALIST CYBER BULLETS (Ref: image_902a6f) */
    .bullet-row { @apply flex gap-6 py-4 border-b border-slate-800/30 last:border-none items-start; }
    .bullet-node { @apply w-2 h-2 rounded-full shrink-0 mt-2.5 shadow-[0_0_10px_rgba(99,102,241,0.5)]; background: #6366f1; }
    .bullet-done { @apply shadow-[0_0_12px_#10b981]; background: #10b981; }

    .search-field { @apply w-full pl-16 pr-10 py-7 rounded-[3rem] border border-slate-800 bg-[#0f172a] text-white font-bold text-base outline-none focus:ring-4 focus:ring-indigo-500/10 focus:border-indigo-500/40 transition-all; }
    
    details summary::-webkit-details-marker { display: none; }
    details > summary { list-style: none; }
</style>
</head>
<body>

<nav class="bg-[#020617]/95 backdrop-blur-3xl border-b border-slate-800/50 px-12 py-10 sticky top-0 z-50">
    <div class="max-w-[1800px] mx-auto flex justify-between items-center">
        <div class="flex items-center gap-7">
            <div class="bg-indigo-600 w-14 h-14 rounded-2xl flex items-center justify-center shadow-indigo-600/40 shadow-2xl border border-white/10"><i class="fas fa-layer-group text-white text-base"></i></div>
            <div>
                <h1 class="text-2xl font-black tracking-tighter uppercase leading-none text-white">PSHS-WVCIC</h1>
                <p class="text-[11px] font-bold text-slate-500 uppercase tracking-[0.45em] mt-2.5">Strategic Infrastructure Node</p>
            </div>
        </div>
        <div class="flex items-center gap-4 bg-emerald-500/5 text-emerald-400 px-7 py-4 rounded-full border border-emerald-500/10 text-[11px] font-black uppercase tracking-widest">
            <span class="w-3 h-3 bg-emerald-500 rounded-full animate-pulse shadow-[0_0_15px_#10b981]"></span> Terminal Active
        </div>
    </div>
</nav>

<main class="dashboard-container">
    
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-6 gap-10 mb-24">
        <div class="kpi-tile border-l-8 border-l-indigo-600">
            <span class="kpi-label">Allocated Budget</span>
            <span id="kpi-budget" class="kpi-value text-white">₱0.00</span>
        </div>
        <div class="kpi-tile">
            <span class="kpi-label">Expenditure</span>
            <span id="kpi-actual" class="kpi-value text-slate-400">₱0.00</span>
        </div>
        <div class="kpi-tile">
            <span class="kpi-label">Variance</span>
            <span id="kpi-variance" class="kpi-value text-rose-500">₱0.00</span>
        </div>
        <div class="kpi-tile kpi-active">
            <span class="kpi-label text-indigo-200">Execution Progress</span>
            <span id="kpi-progress" class="kpi-value">0%</span>
        </div>
        <div class="kpi-tile items-center justify-center text-center">
            <span class="kpi-label mb-5">SPI (Schedule)</span>
            <div class="w-28 h-14 relative"><canvas id="gaugeSPI"></canvas></div>
            <span id="spi-text" class="text-[12px] font-black mt-4 text-indigo-400 tracking-[0.3em]">1.00</span>
        </div>
        <div class="kpi-tile items-center justify-center text-center">
            <span class="kpi-label mb-5">CPI (Cost)</span>
            <div class="w-28 h-14 relative"><canvas id="gaugeCPI"></canvas></div>
            <span id="cpi-text" class="text-[12px] font-black mt-4 text-emerald-400 tracking-[0.3em]">1.00</span>
        </div>
    </div>

    <div class="flex flex-col xl:flex-row gap-10 mb-24 items-center">
        <div class="relative flex-grow w-full">
            <i class="fas fa-search absolute left-8 top-1/2 -translate-y-1/2 text-slate-700"></i>
            <input type="text" id="searchInput" placeholder="Search Strategic Project Archives..." class="search-field">
        </div>
        <select id="fyFilter" onchange="renderUI()" class="search-field w-auto min-w-[280px] bg-[#0f172a] border-slate-800 text-slate-500 cursor-pointer"></select>
    </div>

    <div id="project-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-20 pb-64"></div>
</main>

<script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbz-9wukcFnCwKNhcmTrTRQaY9fc_vOJA8O6yqNA71XKrJmiAj-b5f6uYzSG07JUjAcR/exec';
    let allProjects = [];
    let charts = {};

    async function init() {
        try {
            const response = await fetch(scriptURL);
            allProjects = await response.json();
            populateFYFilter();
            initCharts();
            renderUI();
        } catch (e) { console.error("Sync Failure:", e); }
    }

    function populateFYFilter() {
        const fySelect = document.getElementById('fyFilter');
        const years = [...new Set(allProjects.map(p => p.FiscalYear).filter(y => y))].sort().reverse();
        fySelect.innerHTML = '<option value="All">All Fiscal Years</option>' + years.map(y => `<option value="${y}">Fiscal Year ${y}</option>`).join('');
    }

    function clean(v) {
        if (!v) return 0;
        const str = v.toString().replace(/[^\d.-]/g, '');
        const num = parseFloat(str);
        return isNaN(num) ? 0 : num;
    }

    function renderUI() {
        const term = document.getElementById('searchInput').value.toLowerCase();
        const fy = document.getElementById('fyFilter').value;
        const filtered = allProjects.filter(p => {
            const searchPool = `${p.ProjectName} ${p.Contractor} ${p.Location}`.toLowerCase();
            return searchPool.includes(term) && (fy === 'All' || p.FiscalYear === fy);
        });
        renderCards(filtered);
        updateKPIs(filtered);
    }

    function renderCards(projects) {
        const grid = document.getElementById('project-grid');
        grid.innerHTML = projects.length ? '' : '<div class="col-span-full py-60 text-center opacity-10 font-black uppercase text-xs tracking-[1.5em]">System Standby</div>';

        projects.forEach(p => {
            const accent = p.Status === 'Completed' ? 'bg-completed' : (p.Status === 'In Progress' ? 'bg-ongoing' : 'bg-slate-700');
            const badge = p.Status === 'Completed' ? 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20' : (p.Status === 'In Progress' ? 'bg-amber-500/10 text-amber-400 border-amber-500/20' : 'bg-slate-800 text-slate-500');
            const cost = '₱' + clean(p.Cost).toLocaleString('en-PH', {minimumFractionDigits: 2});
            
            const listParser = (str) => {
                if (!str || str === "---") return '<p class="text-[12px] text-slate-700 italic px-4">No data registered</p>';
                return str.split(/[;\n]/).filter(x => x.trim()).map((item) => {
                    const isDone = p.Status === 'Completed';
                    return `
                        <div class="bullet-row">
                            <span class="bullet-node ${isDone ? 'bullet-done' : ''}"></span>
                            <span class="text-[14px] font-bold text-slate-400 leading-relaxed">${item.trim()}</span>
                        </div>`;
                }).join('');
            };

            grid.innerHTML += `
                <div class="project-card">
                    <div class="status-accent ${accent}"></div>
                    <div class="p-14 flex flex-col h-full">
                        <div class="flex justify-between items-center mb-12">
                            <span class="badge px-5 py-2.5 rounded-full text-[10px] font-black uppercase tracking-[0.2em] border border-white/5 shadow-2xl">${p.Status}</span>
                            <span class="text-[11px] font-black text-slate-700 uppercase tracking-[0.3em]">${p.FiscalYear || 'FY --'}</span>
                        </div>
                        
                        <h3 class="text-3xl font-black leading-tight uppercase mb-14 min-h-[7.5rem] text-white tracking-tight italic">${p.ProjectName}</h3>
                        
                        <details class="group"><summary class="detail-bar"><span class="text-[11px] font-black text-slate-500 uppercase tracking-widest"><i class="fas fa-layer-group mr-4 text-indigo-500"></i> Scope of Works</span><span class="chevron-icon"><i class="fas fa-chevron-right"></i></span></summary><div class="mb-14 px-4">${listParser(p.Scope)}</div></details>
                        <details class="group"><summary class="detail-bar"><span class="text-[11px] font-black text-slate-500 uppercase tracking-widest"><i class="fas fa-feather-pointed mr-4 text-slate-600"></i> Admin Remarks</span><span class="chevron-icon"><i class="fas fa-chevron-right"></i></span></summary><div class="mb-14 px-4">${listParser(p.Notes)}</div></details>

                        <div class="mt-auto pt-14 border-t border-slate-800/60">
                            <div class="grid grid-cols-2 gap-8 mb-14">
                                <div><p class="text-[11px] font-black text-slate-600 uppercase mb-3 tracking-widest">Target Finish</p><p class="text-[13px] font-black text-white">${p.TargetDate || '---'}</p></div>
                                <div class="text-right"><p class="text-[11px] font-black text-slate-600 uppercase mb-3 tracking-widest">Institutional Valuation</p><p class="text-sm font-black text-white tabular-nums">${cost}</p></div>
                            </div>
                            ${p.AttachmentURL ? `<a href="${p.AttachmentURL}" target="_blank" class="w-full py-6 bg-white text-[#020617] rounded-[2rem] text-[11px] font-black uppercase tracking-[0.5em] flex items-center justify-center gap-5 hover:bg-indigo-600 hover:text-white transition-all shadow-2xl"><i class="fas fa-file-contract"></i> Record Vault</a>` : `<div class="w-full py-6 bg-slate-900/50 text-slate-700 rounded-[2rem] text-[11px] font-black uppercase text-center tracking-widest italic border border-slate-800/30">Archives Offline</div>`}
                            <div class="mt-16">
                                <div class="flex justify-between items-center text-[11px] font-black text-slate-700 uppercase tracking-widest mb-5"><span>Execution Status</span><span class="text-indigo-400 font-black">${p.Progress || 0}%</span></div>
                                <div class="w-full bg-slate-800 h-2.5 rounded-full overflow-hidden shadow-inner"><div class="bg-indigo-600 h-full transition-all duration-1000 shadow-[0_0_25px_#6366f1]" style="width: ${p.Progress || 0}%"></div></div>
                            </div>
                        </div>
                    </div>
                </div>`;
        });
    }

    function initCharts() {
        const opt = { cutout: '82%', circumfrence: 180, rotation: 270, plugins: { legend: { display: false } }, responsive: true, maintainAspectRatio: false };
        charts.spi = new Chart(document.getElementById('gaugeSPI'), { type: 'doughnut', data: { datasets: [{ data: [0.5, 0.5], backgroundColor: ['#6366f1', '#1f2937'], borderWidth: 0 }] }, options: opt });
        charts.cpi = new Chart(document.getElementById('gaugeCPI'), { type: 'doughnut', data: { datasets: [{ data: [0.5, 0.5], backgroundColor: ['#10b981', '#1f2937'], borderWidth: 0 }] }, options: opt });
    }

    function updateKPIs(data) {
        const total = data.reduce((sum, p) => sum + clean(p.Cost), 0);
        const actual = data.reduce((sum, p) => sum + clean(p.ActualCost), 0);
        const planned = data.reduce((sum, p) => sum + clean(p.PlannedValue || p['Planned Value']), 0);
        const avg = data.length ? data.reduce((sum, p) => sum + clean(p.Progress), 0) / data.length : 0;

        document.getElementById('kpi-budget').textContent = '₱' + total.toLocaleString('en-PH');
        document.getElementById('kpi-actual').textContent = '₱' + actual.toLocaleString('en-PH');
        document.getElementById('kpi-variance').textContent = '₱' + (total - actual).toLocaleString('en-PH');
        document.getElementById('kpi-progress').textContent = Math.round(avg) + '%';
        
        const ev = total * (avg / 100);
        const spi = planned > 0 ? ev / planned : 1;
        const cpi = actual > 0 ? ev / actual : 1;
        
        document.getElementById('spi-text').textContent = spi.toFixed(2);
        document.getElementById('cpi-text').textContent = cpi.toFixed(2);
        
        charts.spi.data.datasets[0].data = [spi > 1 ? 1 : spi, spi > 1 ? 0 : 1 - spi];
        charts.cpi.data.datasets[0].data = [cpi > 1 ? 1 : cpi, cpi > 1 ? 0 : 1 - cpi];
        charts.spi.update(); charts.cpi.update();
    }

    document.getElementById('searchInput').addEventListener('input', renderUI);
    init();
</script>
</body>
</html>
</component>
