<component name="canvas" id="v7-flexible-doc-dashboard" type="code" title="Professional Dashboard v7 - Flexible Labels" language="html" version="7">
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Infrastructure Progress Dashboard | PSHS-WVCIC</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
body { font-family: 'Inter', sans-serif; letter-spacing: -0.011em; }
.status-badge { @apply px-2.5 py-1 rounded-md text-[10px] font-bold tracking-wider uppercase border; }
.completed { @apply bg-emerald-50 text-emerald-700 border-emerald-100; }
.ongoing { @apply bg-amber-50 text-amber-700 border-amber-100; }
.revision { @apply bg-rose-50 text-rose-700 border-rose-100; }
.reviewing { @apply bg-blue-50 text-blue-700 border-blue-100; }
.proposed { @apply bg-slate-100 text-slate-600 border-slate-200; }

    .custom-card { @apply bg-white border border-slate-200 transition-all duration-300; }
    .custom-card:hover { @apply border-indigo-300 -translate-y-1 shadow-xl; }
    
    .filter-chip { @apply px-4 py-2 rounded-full text-xs font-bold border border-slate-200 transition-all cursor-pointer bg-white text-slate-500 hover:border-indigo-500; }
    .filter-chip.active { @apply bg-indigo-600 text-white border-indigo-600 shadow-lg shadow-indigo-100; }
</style>
</head>
<body class="bg-[#f8fafc] text-slate-900 min-h-screen">

<nav class="bg-white border-b border-slate-200 sticky top-0 z-50 shadow-sm px-6 lg:px-12 py-4">
    <div class="max-w-7xl mx-auto flex justify-between items-center">
        <div class="flex items-center gap-4">
            <div class="bg-slate-900 w-10 h-10 rounded-xl flex items-center justify-center shadow-lg"><i class="fas fa-landmark text-white"></i></div>
            <div>
                <h1 class="text-lg font-black tracking-tighter uppercase leading-none">PSHS-WVCIC</h1>
                <p class="text-[9px] font-bold text-slate-400 uppercase tracking-widest mt-1">Infrastructure Oversight Dashboard</p>
            </div>
        </div>
        <div class="text-[10px] font-black text-slate-400 uppercase tracking-widest flex items-center gap-2">
            <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> Cloud Sync Active
        </div>
    </div>
</nav>

<main class="max-w-7xl mx-auto px-6 lg:px-12 py-10">
    
    <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-10">
        <div class="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm">
            <p class="text-[10px] font-black text-slate-400 uppercase mb-2">Total Portfolio</p>
            <h2 id="kpi-total" class="text-3xl font-black italic">--</h2>
        </div>
        <div class="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm">
            <p class="text-[10px] font-black text-slate-400 uppercase mb-2">Completion Avg</p>
            <h2 id="kpi-avg" class="text-3xl font-black text-indigo-600 italic">--%</h2>
        </div>
        <div class="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm md:col-span-2 flex justify-between items-center">
            <div>
                <p class="text-[10px] font-black text-slate-400 uppercase mb-2">Total Asset Value</p>
                <h2 id="kpi-budget" class="text-3xl font-black italic">₱0.00</h2>
            </div>
            <div class="w-24 h-24">
                <canvas id="statusChart"></canvas>
            </div>
        </div>
    </div>

    <div class="flex flex-col md:flex-row gap-6 mb-10 items-center justify-between">
        <div class="relative w-full md:w-96">
            <i class="fas fa-search absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
            <input type="text" id="searchInput" placeholder="Search project or contractor..." class="w-full pl-12 pr-4 py-3 rounded-2xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-all text-sm font-medium">
        </div>
        <div class="flex gap-2 overflow-x-auto pb-2 w-full md:w-auto">
            <div class="filter-chip active" onclick="filterByStatus('All')">All</div>
            <div class="filter-chip" onclick="filterByStatus('Completed')">Completed</div>
            <div class="filter-chip" onclick="filterByStatus('In Progress')">Ongoing</div>
            <div class="filter-chip" onclick="filterByStatus('Proposed')">Proposed</div>
        </div>
    </div>

    <div id="project-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
        </div>
</main>

<script>
    const scriptURL = '[https://script.google.com/macros/s/AKfycbz-9wukcFnCwKNhcmTrTRQaY9fc_vOJA8O6yqNA71XKrJmiAj-b5f6uYzSG07JUjAcR/exec](https://script.google.com/macros/s/AKfycbz-9wukcFnCwKNhcmTrTRQaY9fc_vOJA8O6yqNA71XKrJmiAj-b5f6uYzSG07JUjAcR/exec)';
    let allProjects = [];
    let activeFilter = 'All';
    let chartInstance = null;

    async function init() {
        try {
            const response = await fetch(scriptURL);
            allProjects = await response.json();
            renderUI();
        } catch (error) {
            console.error("Sync Error:", error);
        }
    }

    function renderUI() {
        const searchTerm = document.getElementById('searchInput').value.toLowerCase();
        const filtered = allProjects.filter(p => {
            const matchesSearch = p.ProjectName.toLowerCase().includes(searchTerm) || p.Contractor.toLowerCase().includes(searchTerm);
            const matchesFilter = activeFilter === 'All' || p.Status === activeFilter;
            return matchesSearch && matchesFilter;
        });

        renderCards(filtered);
        updateKPIs(allProjects);
        updateChart(allProjects);
    }

    function renderCards(projects) {
        const container = document.getElementById('project-container');
        container.innerHTML = projects.length ? '' : '<div class="col-span-full text-center py-20 text-slate-400 font-bold uppercase tracking-widest">No matching records</div>';

        projects.forEach(project => {
            // Status and Base Config
            const statusMap = {
                'Completed': { class: 'completed', label: 'Final Inspection Report', icon: 'fa-clipboard-check' },
                'In Progress': { class: 'ongoing', label: 'Approved Document', icon: 'fa-file-signature' },
                'Financial Revision': { class: 'revision', label: 'Detailed Estimate', icon: 'fa-calculator' },
                'Review Stage': { class: 'reviewing', label: 'Project Document', icon: 'fa-file-alt' },
                'Proposed': { class: 'proposed', label: 'Detailed Estimate', icon: 'fa-calculator' }
            };
            
            let ui = statusMap[project.Status] || { class: 'proposed', label: 'Document', icon: 'fa-file' };

            // --- DYNAMIC LABEL LOGIC ---
            // If the sheet has a specific DocLabel, use it. 
            // Otherwise, check if it's "Consultancy" to use "Terms of Reference".
            let finalLabel = project.DocLabel || ui.label;
            let finalIcon = ui.icon;

            if (!project.DocLabel && project.ProjectName.toLowerCase().includes('consultancy')) {
                if (project.Status !== 'Completed') {
                    finalLabel = 'Terms of Reference';
                    finalIcon = 'fa-file-contract';
                }
            }

            const cost = project.Cost ? '₱' + Number(project.Cost).toLocaleString('en-PH', {minimumFractionDigits: 2}) : '---';

            container.innerHTML += `
                <div class="custom-card rounded-[2.5rem] p-8 flex flex-col">
                    <div class="flex justify-between items-center mb-6">
                        <span class="status-badge ${ui.class}">${project.Status}</span>
                        <span class="text-[11px] font-black tabular-nums text-slate-400">${cost}</span>
                    </div>
                    <h3 class="text-lg font-black leading-tight uppercase mb-6 min-h-[4rem]">${project.ProjectName}</h3>
                    
                    <div class="bg-slate-50 rounded-2xl p-5 mb-8 flex-grow">
                        <p class="text-[11px] font-medium text-slate-500 italic">"${project.Notes || 'Administrative monitoring active.'}"</p>
                    </div>

                    <div class="space-y-6 pt-6 border-t border-slate-100 mt-auto">
                        ${project.AttachmentURL ? `
                            <a href="${project.AttachmentURL}" target="_blank" class="w-full py-4 bg-slate-900 text-white rounded-2xl text-[10px] font-black uppercase tracking-[0.2em] flex items-center justify-center gap-3 hover:bg-indigo-600 transition">
                                <i class="fas ${finalIcon}"></i> ${finalLabel}
                            </a>
                        ` : `<div class="w-full py-4 bg-slate-100 text-slate-400 rounded-2xl text-[10px] font-black uppercase text-center tracking-widest">Awaiting Upload</div>`}
                        
                        <div>
                            <div class="w-full bg-slate-100 h-1.5 rounded-full overflow-hidden mb-4">
                                <div class="bg-indigo-600 h-full rounded-full" style="width: ${project.Progress || 0}%"></div>
                            </div>
                            <div class="flex justify-between items-center text-[9px] font-bold text-slate-400 uppercase tracking-widest">
                                <span>${project.Contractor || 'Internal'}</span>
                                <span>${project.Progress || 0}% Complete</span>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        });
    }

    function updateKPIs(data) {
        document.getElementById('kpi-total').textContent = data.length;
        const avg = data.length ? data.reduce((sum, p) => sum + (Number(p.Progress) || 0), 0) / data.length : 0;
        document.getElementById('kpi-avg').textContent = Math.round(avg) + '%';
        const total = data.reduce((sum, p) => sum + (Number(p.Cost) || 0), 0);
        document.getElementById('kpi-budget').textContent = '₱' + total.toLocaleString('en-PH', {minimumFractionDigits: 2});
    }

    function updateChart(data) {
        const counts = { 'Completed': 0, 'In Progress': 0, 'Proposed': 0, 'Other': 0 };
        data.forEach(p => {
            if (counts[p.Status] !== undefined) counts[p.Status]++;
            else counts['Other']++;
        });
        
        if (chartInstance) chartInstance.destroy();
        const ctx = document.getElementById('statusChart').getContext('2d');
        chartInstance = new Chart(ctx, {
            type: 'doughnut',
            data: {
                datasets: [{
                    data: Object.values(counts),
                    backgroundColor: ['#10b981', '#f59e0b', '#64748b', '#3b82f6'],
                    borderWidth: 0
                }]
            },
            options: { cutout: '75%', plugins: { legend: { display: false } }, responsive: true, maintainAspectRatio: false }
        });
    }

    function filterByStatus(status) {
        activeFilter = status;
        document.querySelectorAll('.filter-chip').forEach(c => c.classList.toggle('active', c.textContent.includes(status)));
        renderUI();
    }

    document.getElementById('searchInput').addEventListener('input', renderUI);
    init();
</script>
</body>
</html>
</component>
