<component name="canvas" id="v35-pshs-optimized" type="code" title="PSHS Command Console v35 - Final Sheet Optimized" language="html" version="35">
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PSHS-WVCIC | Infrastructure Command</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f1f5f9; color: #1e293b; }
.dashboard-container { @apply max-w-[1600px] mx-auto px-8 py-10; }
.metric-tile { @apply bg-white p-7 rounded-[2rem] border border-slate-200 shadow-sm flex flex-col justify-between transition-all hover:border-indigo-400; }
.metric-label { @apply text-[10px] font-black text-slate-400 uppercase tracking-[0.2em] mb-2; }
.metric-value { @apply text-2xl font-black text-slate-900 tabular-nums tracking-tighter; }
.project-card { @apply bg-white border border-slate-200 rounded-[2.5rem] overflow-hidden flex flex-col h-full transition-all duration-300 hover:shadow-2xl hover:-translate-y-1; }
.status-accent { @apply h-3 w-full; }
.bg-completed { @apply bg-[#10b981]; }
.bg-ongoing { @apply bg-[#f59e0b]; }
.bg-proposed { @apply bg-[#f43f5e]; }
.task-row { @apply flex gap-4 p-3.5 rounded-2xl border-b border-slate-50 last:border-none hover:bg-slate-50; }
.task-id { @apply w-5 h-5 flex items-center justify-center rounded-full text-[8px] font-black shrink-0 mt-0.5 shadow-sm; }
.tag { @apply bg-slate-100 text-slate-500 px-2.5 py-1 rounded-lg text-[8px] font-black uppercase tracking-widest mr-1.5 mb-1.5 inline-block; }
.modern-search { @apply w-full pl-14 pr-6 py-5 rounded-[1.5rem] border border-slate-100 bg-white shadow-sm transition-all text-sm font-bold outline-none focus:ring-4 focus:ring-indigo-50 focus:border-indigo-400; }
details summary::-webkit-details-marker { display: none; }
details > summary { list-style: none; }
</style>
</head>
<body>

<nav class="bg-white/90 backdrop-blur-md border-b border-slate-200 px-8 py-5 sticky top-0 z-50">
    <div class="max-w-[1600px] mx-auto flex justify-between items-center">
        <div class="flex items-center gap-4">
            <div class="bg-slate-900 w-11 h-11 rounded-2xl flex items-center justify-center shadow-lg"><i class="fas fa-microchip text-white text-sm"></i></div>
            <div>
                <h1 class="text-base font-black tracking-tighter uppercase leading-none">PSHS-WVCIC</h1>
                <p class="text-[9px] font-bold text-slate-400 uppercase tracking-widest mt-1.5">Infrastructure Command Console</p>
            </div>
        </div>
        <div id="syncStatus" class="flex items-center gap-3 bg-emerald-50 text-emerald-600 px-5 py-2.5 rounded-full border border-emerald-100 text-[9px] font-black uppercase">
            <span class="w-2 h-2 bg-emerald-500 rounded-full animate-pulse"></span> Masterlist Synchronized
        </div>
    </div>
</nav>

<main class="dashboard-container">
    <div class="grid grid-cols-1 md:grid-cols-3 xl:grid-cols-6 gap-8 mb-16">
        <div class="metric-tile border-l-4 border-l-indigo-600">
            <span class="metric-label">Allocated Budget</span>
            <span id="kpi-budget" class="metric-value text-indigo-700">₱0.00</span>
        </div>
        <div class="metric-tile">
            <span class="metric-label">Actual Expenditure</span>
            <span id="kpi-actual" class="metric-value">₱0.00</span>
        </div>
        <div class="metric-tile">
            <span class="metric-label">Cost Variance</span>
            <span id="kpi-variance" class="metric-value">₱0.00</span>
        </div>
        <div class="metric-tile bg-[#0f172a] text-white border-none shadow-xl">
            <span class="metric-label text-slate-500">Portfolio Progress</span>
            <div class="flex items-center justify-between">
                <span id="kpi-avg" class="text-3xl font-black italic">--%</span>
                <i class="fas fa-chart-line text-slate-700"></i>
            </div>
        </div>
        <div class="metric-tile flex items-center justify-center text-center">
            <span class="metric-label mb-3">SPI (Schedule)</span>
            <div class="w-20 h-10 relative"><canvas id="gaugeSPI"></canvas></div>
            <span id="spi-text" class="text-[10px] font-black mt-2 text-indigo-600">1.00</span>
        </div>
        <div class="metric-tile flex items-center justify-center text-center">
            <span class="metric-label mb-3">CPI (Cost)</span>
            <div class="w-20 h-10 relative"><canvas id="gaugeCPI"></canvas></div>
            <span id="cpi-text" class="text-[10px] font-black mt-2 text-emerald-600">1.00</span>
        </div>
    </div>

    <div class="flex flex-col xl:flex-row gap-6 mb-12 items-center">
        <div class="relative flex-grow w-full">
            <i class="fas fa-search absolute left-6 top-1/2 -translate-y-1/2 text-slate-300"></i>
            <input type="text" id="searchInput" placeholder="Search by Project, Contractor, Building, or Category..." class="modern-search">
        </div>
        <select id="fyFilter" onchange="renderUI()" class="modern-search w-auto min-w-[160px] border-none bg-slate-50 cursor-pointer"></select>
    </div>

    <div id="project-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-12 pb-40"></div>
</main>

<script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbz-9wukcFnCwKNhcmTrTRQaY9fc_vOJA8O6yqNA71XKrJmiAj-b5f6uYzSG07JUjAcR/exec';
    let allProjects = [];
    let charts = {};

    async function init() {
        try {
            const response = await fetch(scriptURL);
            allProjects = await response.json();
            populateFYFilter();
            initGauges();
            renderUI();
        } catch (e) { console.error("Handshake Error:", e); }
    }

    function populateFYFilter() {
        const fySelect = document.getElementById('fyFilter');
        const years = [...new Set(allProjects.map(p => p.FiscalYear).filter(y => y))].sort().reverse();
        fySelect.innerHTML = '<option value="All">All Fiscal Years</option>' + years.map(y => `<option value="${y}">${y}</option>`).join('');
    }

    // IMPROVED NUMERIC CLEANER: Handles commas and spaces
    function clean(v) {
        if (!v) return 0;
        const str = v.toString().replace(/[^\d.-]/g, '');
        const num = parseFloat(str);
        return isNaN(num) ? 0 : num;
    }

    function renderUI() {
        const term = document.getElementById('searchInput').value.toLowerCase();
        const fy = document.getElementById('fyFilter').value;
        const filtered = allProjects.filter(p => {
            const searchPool = `${p.ProjectName} ${p.Contractor} ${p.Location} ${p.Category}`.toLowerCase();
            return searchPool.includes(term) && (fy === 'All' || p.FiscalYear === fy);
        });
        renderCards(filtered);
        updateKPIs(filtered);
    }

    function renderCards(projects) {
        const grid = document.getElementById('project-grid');
        grid.innerHTML = projects.length ? '' : '<div class="col-span-full py-40 text-center opacity-20 font-black uppercase text-xs text-slate-400">No Records Found</div>';

        projects.forEach(p => {
            const accent = p.Status === 'Completed' ? 'bg-completed' : (p.Status === 'In Progress' ? 'bg-ongoing' : 'bg-proposed');
            const badgeStyle = p.Status === 'Completed' ? 'bg-emerald-50 text-emerald-700 border-emerald-100' : (p.Status === 'In Progress' ? 'bg-amber-50 text-amber-700 border-amber-100' : 'bg-slate-100 text-slate-500 border-slate-200');
            const cost = '₱' + clean(p.Cost).toLocaleString('en-PH', {minimumFractionDigits: 2});
            
            const listParser = (str, color) => {
                if (!str || str === "---") return '<p class="text-[10px] text-slate-300 italic">No details available</p>';
                return str.split(/[;\n]/).filter(x => x.trim()).map((item, i) => {
                    const isDone = p.Status === 'Completed';
                    return `<div class="task-row"><span class="task-id ${isDone ? 'bg-emerald-500' : color} text-white">${isDone ? '<i class="fas fa-check"></i>' : (i + 1)}</span><span class="text-[11px] font-bold text-slate-600">${item.trim()}</span></div>`;
                }).join('');
            };

            grid.innerHTML += `
                <div class="project-card shadow-sm">
                    <div class="status-accent ${accent}"></div>
                    <div class="p-10">
                        <div class="flex justify-between items-center mb-6">
                            <span class="badge ${badgeStyle}">${p.Status}</span>
                            <span class="text-[10px] font-black text-slate-300 uppercase">${p.FiscalYear || 'FY --'}</span>
                        </div>
                        <div class="flex flex-wrap mb-4">${(p.Location || "Main Campus").split(';').map(l => `<span class="tag">${l.trim()}</span>`).join('')}</div>
                        <h3 class="text-xl font-black uppercase mb-10 min-h-[5rem] text-slate-800">${p.ProjectName}</h3>
                        <details class="group mb-4"><summary class="bg-slate-50 p-5 rounded-2xl border border-slate-100 text-[10px] font-black text-slate-500 uppercase cursor-pointer">Scope of Works</summary><div class="mt-4">${listParser(p.Scope, 'bg-indigo-600')}</div></details>
                        <div class="mt-8 pt-8 border-t border-slate-100">
                            <div class="grid grid-cols-2 gap-4 mb-8">
                                <div><p class="text-[9px] font-black text-slate-400 uppercase mb-1">Target Date</p><p class="text-xs font-black text-slate-900">${p.TargetDate || 'Pending'}</p></div>
                                <div class="text-right"><p class="text-[9px] font-black text-slate-400 uppercase mb-1">Cost</p><p class="text-sm font-black text-slate-900">${cost}</p></div>
                            </div>
                            <div class="flex justify-between items-center text-[10px] font-black text-slate-400 uppercase mb-3"><span>Progress</span><span>${p.Progress || 0}%</span></div>
                            <div class="w-full bg-slate-100 h-2 rounded-full overflow-hidden"><div class="bg-indigo-600 h-full" style="width: ${p.Progress || 0}%"></div></div>
                        </div>
                    </div>
                </div>`;
        });
    }

    function initGauges() {
        const opt = { cutout: '80%', circumfrence: 180, rotation: 270, plugins: { legend: { display: false } }, responsive: true, maintainAspectRatio: false };
        charts.spi = new Chart(document.getElementById('gaugeSPI'), { type: 'doughnut', data: { datasets: [{ data: [0.5, 0.5], backgroundColor: ['#6366f1', '#f1f5f9'], borderWidth: 0 }] }, options: opt });
        charts.cpi = new Chart(document.getElementById('gaugeCPI'), { type: 'doughnut', data: { datasets: [{ data: [0.5, 0.5], backgroundColor: ['#10b981', '#f1f5f9'], borderWidth: 0 }] }, options: opt });
    }

    function updateKPIs(data) {
        const total = data.reduce((sum, p) => sum + clean(p.Cost), 0);
        const actual = data.reduce((sum, p) => sum + clean(p.ActualCost), 0);
        const planned = data.reduce((sum, p) => sum + clean(p.PlannedValue || p['Planned Value']), 0);
        const avg = data.length ? data.reduce((sum, p) => sum + (clean(p.Progress) || 0), 0) / data.length : 0;

        document.getElementById('kpi-budget').textContent = '₱' + total.toLocaleString('en-PH');
        document.getElementById('kpi-actual').textContent = '₱' + actual.toLocaleString('en-PH');
        document.getElementById('kpi-variance').textContent = '₱' + (total - actual).toLocaleString('en-PH');
        document.getElementById('kpi-avg').textContent = Math.round(avg) + '%';
        
        const ev = total * (avg / 100);
        const spi = planned > 0 ? ev / planned : 1;
        const cpi = actual > 0 ? ev / actual : 1;
        
        document.getElementById('spi-text').textContent = spi.toFixed(2);
        document.getElementById('cpi-text').textContent = cpi.toFixed(2);
        
        charts.spi.data.datasets[0].data = [spi > 1 ? 1 : spi, spi > 1 ? 0 : 1 - spi];
        charts.cpi.data.datasets[0].data = [cpi > 1 ? 1 : cpi, cpi > 1 ? 0 : 1 - cpi];
        charts.spi.update(); charts.cpi.update();
    }

    document.getElementById('searchInput').addEventListener('input', renderUI);
    init();
</script>
</body>
</html>
</component>
