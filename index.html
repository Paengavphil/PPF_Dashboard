<component name="canvas" id="v41-final-render" type="code" title="PSHS Milestone Precision v41" language="html" version="41">
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PSHS-WVCIC | Milestone Precision</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root { --bg: #030712; --card: #111827; --border: #1f2937; --success: #10b981; --accent: #6366f1; }
body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: var(--bg); color: #f9fafb; letter-spacing: -0.01em; }
.dashboard-container { @apply max-w-[1800px] mx-auto px-10 py-12; }

    /* KPI Tiles - Obsidian Style */
    .kpi-tile { @apply bg-[#111827] p-8 rounded-[2.5rem] border border-gray-800 shadow-2xl flex flex-col justify-between transition-all hover:border-indigo-500/30; }
    .kpi-label { @apply text-[10px] font-black text-gray-500 uppercase tracking-[0.25em] mb-2; }
    .kpi-value { @apply text-2xl font-black text-white tabular-nums tracking-tighter; }
    
    /* Highlight Metric - Executive reference */
    .kpi-accent { @apply bg-indigo-600 border-none shadow-indigo-500/20 ring-1 ring-white/10; }
    .kpi-accent .kpi-value { @apply text-4xl italic font-extrabold; }

    /* Infrastructure Card Design */
    .project-card { @apply bg-[#111827] border border-gray-800 rounded-[3rem] overflow-hidden flex flex-col h-full transition-all duration-500 hover:shadow-indigo-500/10 hover:-translate-y-2; }
    .status-accent { @apply h-3 w-full; }
    .bg-completed { @apply bg-emerald-500; }
    .bg-ongoing { @apply bg-amber-500; }
    .bg-proposed { @apply bg-slate-600; }

    /* GEOMETRIC MILESTONES (Replacing Checkmarks - Ref: image_8faa71) */
    .milestone-row { @apply flex gap-5 py-4 border-b border-gray-800/40 last:border-none items-start; }
    
    /* Shape Option: Milestone Diamond */
    .milestone-diamond { 
        @apply w-3 h-3 bg-emerald-500 rotate-45 shrink-0 mt-2 shadow-[0_0_12px_#10b981]; 
        clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
    }

    /* Shape Option: Vertical Status Bar */
    .milestone-bar { @apply w-1.5 h-4.5 bg-indigo-500 rounded-full shrink-0 mt-1 shadow-[0_0_8px_#6366f1]; }

    /* Details & Search */
    .detail-header { @apply bg-gray-900/50 p-6 rounded-2xl border border-gray-800 mb-5 flex items-center justify-between cursor-pointer hover:bg-gray-800/80 transition-all; }
    .search-hub { @apply w-full pl-14 pr-8 py-5 rounded-[2.5rem] border border-gray-800 bg-[#111827] text-white font-bold text-sm outline-none focus:ring-4 focus:ring-indigo-500/20 focus:border-indigo-500/50 transition-all; }
    
    details summary::-webkit-details-marker { display: none; }
    details > summary { list-style: none; }
</style>
</head>
<body>

<nav class="bg-[#030712]/90 backdrop-blur-2xl border-b border-gray-800 px-12 py-8 sticky top-0 z-50">
    <div class="max-w-[1800px] mx-auto flex justify-between items-center">
        <div class="flex items-center gap-6">
            <div class="bg-indigo-600 w-12 h-12 rounded-2xl flex items-center justify-center shadow-indigo-600/30 shadow-2xl border border-white/10"><i class="fas fa-microchip text-white text-sm"></i></div>
            <div>
                <h1 class="text-xl font-black tracking-tighter uppercase leading-none text-white">PSHS-WVCIC</h1>
                <p class="text-[10px] font-bold text-gray-500 uppercase tracking-[0.35em] mt-2">Executive Milestone Hub</p>
            </div>
        </div>
        <div class="flex items-center gap-3 bg-emerald-500/5 text-emerald-400 px-6 py-3 rounded-full border border-emerald-500/10 text-[10px] font-black uppercase tracking-widest">
            <span class="w-2 h-2 bg-emerald-500 rounded-full animate-pulse shadow-[0_0_12px_#10b981]"></span> Live Data Synchronization
        </div>
    </div>
</nav>

<main class="dashboard-container">
    
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-6 gap-8 mb-20">
        <div class="kpi-tile border-l-4 border-l-indigo-600">
            <span class="kpi-label">Allocated Budget</span>
            <span id="kpi-budget" class="kpi-value">₱0.00</span>
        </div>
        <div class="kpi-tile">
            <span class="kpi-label">Current Expenditure</span>
            <span id="kpi-actual" class="kpi-value text-gray-400">₱0.00</span>
        </div>
        <div class="kpi-tile">
            <span class="kpi-label">Financial Variance</span>
            <span id="kpi-variance" class="kpi-value text-rose-500">₱0.00</span>
        </div>
        <div class="kpi-tile kpi-accent">
            <span class="kpi-label text-indigo-200">Execution Progress</span>
            <span id="kpi-progress" class="kpi-value">0%</span>
        </div>
        <div class="kpi-tile items-center justify-center text-center">
            <span class="kpi-label mb-4">SPI (Schedule)</span>
            <div class="w-24 h-12 relative"><canvas id="gaugeSPI"></canvas></div>
            <span id="spi-text" class="text-[11px] font-black mt-3 text-indigo-400 tracking-widest">1.00</span>
        </div>
        <div class="kpi-tile items-center justify-center text-center">
            <span class="kpi-label mb-4">CPI (Cost)</span>
            <div class="w-24 h-12 relative"><canvas id="gaugeCPI"></canvas></div>
            <span id="cpi-text" class="text-[11px] font-black mt-3 text-emerald-400 tracking-widest">1.00</span>
        </div>
    </div>

    <div class="flex flex-col xl:flex-row gap-8 mb-20 items-center">
        <div class="relative flex-grow w-full">
            <i class="fas fa-search absolute left-8 top-1/2 -translate-y-1/2 text-gray-700"></i>
            <input type="text" id="searchInput" placeholder="Search Infrastructure Milestone Records..." class="search-hub">
        </div>
        <select id="fyFilter" onchange="renderUI()" class="search-hub w-auto min-w-[240px] bg-[#111827] border-gray-800 text-gray-400 cursor-pointer">
            <option value="All">All Fiscal Years</option>
        </select>
    </div>

    <div id="project-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-16 pb-48"></div>
</main>

<script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbz-9wukcFnCwKNhcmTrTRQaY9fc_vOJA8O6yqNA71XKrJmiAj-b5f6uYzSG07JUjAcR/exec';
    let allProjects = [];
    let charts = {};

    async function init() {
        try {
            const response = await fetch(scriptURL);
            allProjects = await response.json();
            populateFYFilter();
            initCharts();
            renderUI();
        } catch (e) { console.error("Data handshake severed:", e); }
    }

    function populateFYFilter() {
        const fySelect = document.getElementById('fyFilter');
        const years = [...new Set(allProjects.map(p => p.FiscalYear).filter(y => y))].sort().reverse();
        years.forEach(year => { const opt = document.createElement('option'); opt.value = year; opt.textContent = `FY ${year}`; fySelect.appendChild(opt); });
    }

    function clean(v) {
        if (!v) return 0;
        const str = v.toString().replace(/[^\d.-]/g, '');
        const num = parseFloat(str);
        return isNaN(num) ? 0 : num;
    }

    function formatStrategicDate(dateStr) {
        if (!dateStr || dateStr === "TBD" || dateStr === "---") return "---";
        const date = new Date(dateStr);
        return isNaN(date.getTime()) ? dateStr : date.toLocaleDateString('en-PH', { month: 'short', day: '2-digit', year: 'numeric' });
    }

    function renderUI() {
        const term = document.getElementById('searchInput').value.toLowerCase();
        const fy = document.getElementById('fyFilter').value;
        const filtered = allProjects.filter(p => {
            const searchPool = `${p.ProjectName} ${p.Contractor} ${p.Location}`.toLowerCase();
            return searchPool.includes(term) && (fy === 'All' || p.FiscalYear === fy);
        });
        renderCards(filtered);
        updateKPIs(filtered);
    }

    function renderCards(projects) {
        const grid = document.getElementById('project-grid');
        grid.innerHTML = projects.length ? '' : '<div class="col-span-full py-40 text-center opacity-10 font-black uppercase text-xs tracking-[0.6em]">Scanning Node</div>';

        projects.forEach(p => {
            const accent = p.Status === 'Completed' ? 'bg-completed' : (p.Status === 'In Progress' ? 'bg-ongoing' : 'bg-slate-700');
            const badge = p.Status === 'Completed' ? 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20' : (p.Status === 'In Progress' ? 'bg-amber-500/10 text-amber-400 border-amber-500/20' : 'bg-gray-800/50 text-gray-500');
            const cost = '₱' + clean(p.Cost).toLocaleString('en-PH', {minimumFractionDigits: 2});
            
            // Professional Milestone Parser (Ref: image_8faa71)
            const listParser = (str, type) => {
                if (!str || str === "---") return '<p class="text-[11px] text-gray-600 italic">No specifics registered</p>';
                return str.split(/[;\n]/).filter(x => x.trim()).map((item, i) => {
                    const isDone = p.Status === 'Completed';
                    // Engineering logic: Diamonds for deliverables, Bars for logs
                    const milestoneClass = type === 'scope' ? 'milestone-diamond' : 'milestone-bar';
                    const pentaltyClass = isDone ? milestoneClass : 'w-2 h-2 rounded-full bg-gray-800 shrink-0 mt-2';
                    return `
                        <div class="milestone-row">
                            <span class="${pentaltyClass}"></span>
                            <span class="text-[12px] font-bold text-gray-400 leading-relaxed">${item.trim()}</span>
                        </div>`;
                }).join('');
            };

            grid.innerHTML += `
                <div class="project-card shadow-2xl">
                    <div class="status-accent ${accent}"></div>
                    <div class="p-12 flex flex-col h-full">
                        <div class="flex justify-between items-center mb-10">
                            <span class="badge px-4 py-2 rounded-full text-[9px] font-black uppercase tracking-[0.15em] border border-white/5 shadow-lg">${p.Status}</span>
                            <span class="text-[10px] font-black text-gray-600 uppercase tracking-widest">${p.FiscalYear || 'FY --'}</span>
                        </div>
                        
                        <h3 class="text-2xl font-black leading-tight uppercase mb-12 min-h-[6.5rem] text-white tracking-tight italic">${p.ProjectName}</h3>
                        
                        <details class="group"><summary class="detail-header"><span class="text-[10px] font-black text-gray-500 uppercase tracking-widest"><i class="fas fa-crosshairs mr-4 text-emerald-500"></i> Scope of Works</span><i class="fas fa-chevron-right text-[10px] group-open:rotate-90 transition-all text-gray-700"></i></summary><div class="mb-12 px-2">${listParser(p.Scope, 'scope')}</div></details>
                        <details class="group"><summary class="detail-header"><span class="text-[10px] font-black text-gray-500 uppercase tracking-widest"><i class="fas fa-terminal mr-4 text-gray-600"></i> Admin Remarks</span><i class="fas fa-chevron-right text-[10px] group-open:rotate-90 transition-all text-gray-700"></i></summary><div class="mb-12 px-2">${listParser(p.Notes, 'notes')}</div></details>

                        <div class="mt-auto pt-12 border-t border-gray-800">
                            <div class="grid grid-cols-2 gap-4 mb-10">
                                <div><p class="text-[10px] font-black text-gray-600 uppercase mb-2 tracking-widest">Target Finish</p><p class="text-[11px] font-black text-white">${formatStrategicDate(p.TargetDate)}</p></div>
                                <div class="text-right"><p class="text-[10px] font-black text-gray-600 uppercase mb-2 tracking-widest">Valuation</p><p class="text-xs font-black text-white tabular-nums">${cost}</p></div>
                            </div>
                            ${p.AttachmentURL ? `<a href="${p.AttachmentURL}" target="_blank" class="w-full py-5 bg-white text-[#030712] rounded-3xl text-[10px] font-black uppercase tracking-[0.4em] flex items-center justify-center gap-4 hover:bg-indigo-600 hover:text-white transition-all shadow-2xl"><i class="fas fa-file-contract"></i> Record Vault</a>` : `<div class="w-full py-5 bg-gray-800 text-gray-600 rounded-3xl text-[10px] font-black uppercase text-center tracking-widest italic border border-gray-700/30">Archives Offline</div>`}
                            <div class="mt-14">
                                <div class="flex justify-between items-center text-[10px] font-black text-gray-600 uppercase tracking-widest mb-4"><span>Physical Completion</span><span class="text-indigo-400 font-black">${p.Progress || 0}%</span></div>
                                <div class="w-full bg-gray-800 h-2 rounded-full overflow-hidden shadow-inner"><div class="bg-indigo-600 h-full transition-all duration-1000 shadow-[0_0_20px_#6366f1]" style="width: ${p.Progress || 0}%"></div></div>
                            </div>
                        </div>
                    </div>
                </div>`;
        });
    }

    function initCharts() {
        const opt = { cutout: '82%', circumfrence: 180, rotation: 270, plugins: { legend: { display: false } }, responsive: true, maintainAspectRatio: false };
        charts.spi = new Chart(document.getElementById('gaugeSPI'), { type: 'doughnut', data: { datasets: [{ data: [0.5, 0.5], backgroundColor: ['#6366f1', '#1f2937'], borderWidth: 0 }] }, options: opt });
        charts.cpi = new Chart(document.getElementById('gaugeCPI'), { type: 'doughnut', data: { datasets: [{ data: [0.5, 0.5], backgroundColor: ['#10b981', '#1f2937'], borderWidth: 0 }] }, options: opt });
    }

    function updateKPIs(data) {
        const total = data.reduce((sum, p) => sum + clean(p.Cost), 0);
        const actual = data.reduce((sum, p) => sum + clean(p.ActualCost), 0);
        const planned = data.reduce((sum, p) => sum + clean(p.PlannedValue || p['Planned Value']), 0);
        const avg = data.length ? data.reduce((sum, p) => sum + clean(p.Progress), 0) / data.length : 0;

        document.getElementById('kpi-budget').textContent = '₱' + total.toLocaleString('en-PH');
        document.getElementById('kpi-actual').textContent = '₱' + actual.toLocaleString('en-PH');
        document.getElementById('kpi-variance').textContent = '₱' + (total - actual).toLocaleString('en-PH');
        document.getElementById('kpi-progress').textContent = Math.round(avg) + '%';
        
        const ev = total * (avg / 100);
        const spi = planned > 0 ? ev / planned : 1;
        const cpi = actual > 0 ? ev / actual : 1;
        
        document.getElementById('spi-text').textContent = spi.toFixed(2);
        document.getElementById('cpi-text').textContent = cpi.toFixed(2);
        
        charts.spi.data.datasets[0].data = [spi > 1 ? 1 : spi, spi > 1 ? 0 : 1 - spi];
        charts.cpi.data.datasets[0].data = [cpi > 1 ? 1 : cpi, cpi > 1 ? 0 : 1 - cpi];
        charts.spi.update(); charts.cpi.update();
    }

    document.getElementById('searchInput').addEventListener('input', renderUI);
    init();
</script>
</body>
</html>
</component>
