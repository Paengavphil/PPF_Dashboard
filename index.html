<component name="canvas" id="final-production-ready-dashboard" type="code" title="Final Production Dashboard Code" language="html" version="5">
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Infrastructure Progress Dashboard | PSHS-WVCIC</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
body { font-family: 'Inter', sans-serif; letter-spacing: -0.011em; overflow-x: hidden; }
.status-badge { @apply px-2.5 py-1 rounded-md text-[10px] font-bold tracking-wider uppercase border; }
.completed { @apply bg-emerald-50 text-emerald-700 border-emerald-100; }
.ongoing { @apply bg-amber-50 text-amber-700 border-amber-100; }
.revision { @apply bg-rose-50 text-rose-700 border-rose-100; }
.reviewing { @apply bg-blue-50 text-blue-700 border-blue-100; }
.proposed { @apply bg-slate-100 text-slate-600 border-slate-200; }

    details summary::-webkit-details-marker { display: none; }
    .custom-card { @apply bg-white border border-slate-200 transition-all duration-300 flex flex-col; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); }
    .custom-card:hover { @apply border-indigo-200; transform: translateY(-2px); box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05); }
    @keyframes pulse-soft { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    .syncing { animation: pulse-soft 2s infinite; }
</style>
</head>
<body class="bg-[#fcfdfe] text-slate-900 min-h-screen">

<nav class="bg-white border-b border-slate-200 sticky top-0 z-50 shadow-sm">
    <div class="max-w-[1400px] mx-auto px-6 lg:px-12 flex justify-between h-20 items-center">
        <div class="flex items-center gap-5">
            <div class="bg-slate-900 w-12 h-12 rounded-xl flex items-center justify-center shadow-lg">
                <i class="fas fa-tools text-white text-xl"></i>
            </div>
            <div>
                <h1 class="text-xl font-black tracking-tighter text-black leading-none uppercase">Infrastructure</h1>
                <p class="text-[9px] font-extrabold text-slate-400 uppercase tracking-[0.3em] leading-none mt-1.5">PSHS-WVCIC PPF Committee</p>
            </div>
        </div>
        <div id="syncStatus" class="flex items-center gap-2 text-[9px] font-black uppercase tracking-widest text-slate-400 syncing">
            <span class="w-1.5 h-1.5 rounded-full bg-indigo-500"></span> Live Sync Active
        </div>
    </div>
</nav>

<main class="max-w-[1400px] mx-auto px-6 lg:px-12 py-10">
    <div class="mb-10 flex flex-col md:flex-row md:items-end justify-between gap-6">
        <div class="max-w-2xl">
            <h2 class="text-4xl font-black text-black tracking-tighter mb-3 uppercase leading-tight">Project Portfolio</h2>
            <div class="flex flex-wrap gap-4 mt-4">
                <div class="bg-white px-4 py-2 rounded-lg border border-slate-100 shadow-sm">
                    <p class="text-[9px] font-bold text-slate-400 uppercase tracking-widest">Total Projects</p>
                    <p id="totalProjects" class="text-lg font-black text-black">--</p>
                </div>
                <div class="bg-white px-4 py-2 rounded-lg border border-slate-100 shadow-sm">
                    <p class="text-[9px] font-bold text-slate-400 uppercase tracking-widest">Active Budget</p>
                    <p id="totalBudget" class="text-lg font-black text-indigo-600">₱0.00</p>
                </div>
            </div>
        </div>
        <div class="flex items-center gap-4 bg-white p-3 rounded-xl border border-slate-100 shadow-sm">
            <div class="w-10 h-10 bg-indigo-50 rounded-lg flex items-center justify-center text-indigo-500"><i class="far fa-calendar-check text-lg"></i></div>
            <div class="pr-5">
                <p class="text-[9px] font-bold text-slate-400 uppercase tracking-widest leading-none">Last Data Sync</p>
                <p id="lastSyncTime" class="text-xs font-bold text-black mt-1">Connecting...</p>
            </div>
        </div>
    </div>

    <div id="project-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 pb-16">
         <p class="text-slate-400 animate-pulse font-bold uppercase tracking-widest text-xs p-8">Fetching records from Google Systems...</p>
    </div>
</main>

<script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbz-9wukcFnCwKNhcmTrTRQaY9fc_vOJA8O6yqNA71XKrJmiAj-b5f6uYzSG07JUjAcR/exec';

    async function fetchDashboardData() {
        try {
            const response = await fetch(scriptURL);
            const projects = await response.json();
            renderCards(projects);
            updateStats(projects);
            document.getElementById('lastSyncTime').textContent = new Date().toLocaleTimeString();
        } catch (error) {
            console.error("Sync Error:", error);
            document.getElementById('project-container').innerHTML = `<p class="text-rose-500 font-bold p-8 text-xs uppercase text-center">Connection Error: Check Sheet Permissions.</p>`;
        }
    }

    function updateStats(projects) {
        document.getElementById('totalProjects').textContent = projects.length;
        const total = projects.reduce((sum, p) => sum + (Number(p.Cost) || 0), 0);
        document.getElementById('totalBudget').textContent = '₱' + total.toLocaleString('en-PH', {minimumFractionDigits: 2});
    }

    function renderCards(projects) {
        const container = document.getElementById('project-container');
        container.innerHTML = '';

        projects.forEach(project => {
            const statusMap = {
                'Completed': { class: 'completed', label: 'Final Inspection Report', icon: 'fa-clipboard-check' },
                'In Progress': { class: 'ongoing', label: 'Approved Document', icon: 'fa-file-signature' },
                'Financial Revision': { class: 'revision', label: 'Detailed Estimate', icon: 'fa-calculator' },
                'Review Stage': { class: 'reviewing', label: 'Project Document', icon: 'fa-file-alt' },
                'Proposed': { class: 'proposed', label: 'Detailed Estimate', icon: 'fa-calculator' }
            };
            
            const ui = statusMap[project.Status] || { class: 'proposed', label: 'View Document', icon: 'fa-file' };

            // Peso Formatting
            const formattedCost = project.Cost ? 
                '₱' + Number(project.Cost).toLocaleString('en-PH', {minimumFractionDigits: 2}) : 
                '---';

            // Scope List Parser
            const scopeHtml = project.Scope ? project.Scope.split(',').map((item, i) => 
                `<li class="flex gap-3"><span class="text-indigo-400 font-black">${(i+1).toString().padStart(2, '0')}</span> ${item.trim()}</li>`
            ).join('') : '<li>No details provided.</li>';

            const cardHTML = `
                <div class="custom-card rounded-[2rem] p-8">
                    <div class="flex justify-between items-center mb-6">
                        <span class="status-badge ${ui.class}">${project.Status}</span>
                        <span class="text-xs font-black text-black tabular-nums">${formattedCost}</span>
                    </div>
                    
                    <h3 class="text-lg font-black text-black mb-5 leading-tight uppercase min-h-[4rem] flex items-center">${project.ProjectName}</h3>
                    
                    <details class="group mb-6">
                        <summary class="flex items-center justify-between cursor-pointer list-none bg-slate-50/70 p-4 rounded-xl border border-slate-100 hover:border-indigo-300 transition-all">
                            <span class="text-[10px] font-black text-slate-700 uppercase tracking-widest flex items-center gap-3"><i class="fas fa-list-ul text-indigo-500"></i> Scope of Works</span>
                            <i class="fas fa-chevron-down text-[10px] text-slate-400 group-open:rotate-180 transition-transform"></i>
                        </summary>
                        <div class="mt-4 px-3">
                            <ul class="space-y-2 text-sm text-slate-600 font-semibold">
                                ${scopeHtml}
                            </ul>
                        </div>
                    </details>

                    <div class="bg-indigo-50/40 border border-indigo-100/50 rounded-xl p-5 mb-8 flex-grow">
                        <p class="text-xs text-slate-600 italic leading-relaxed font-medium">"${project.Notes || 'Pending updates...'}"</p>
                    </div>

                    <div class="space-y-6 pt-6 border-t border-slate-100">
                        ${project.AttachmentURL ? `
                            <a href="${project.AttachmentURL}" target="_blank" class="w-full py-4 bg-slate-900 text-white rounded-2xl text-[10px] font-black uppercase tracking-[0.2em] flex items-center justify-center gap-3 hover:bg-indigo-600 transition shadow-lg">
                                <i class="fas ${ui.icon} text-sm"></i> ${ui.label}
                            </a>
                        ` : `
                            <div class="w-full py-4 bg-slate-100 text-slate-400 rounded-2xl text-[10px] font-black uppercase tracking-[0.2em] flex items-center justify-center gap-3">
                                <i class="fas fa-lock text-xs"></i> Document Pending
                            </div>
                        `}

                        <div>
                            <div class="w-full bg-slate-100 h-2 rounded-full overflow-hidden mb-5">
                                <div class="bg-indigo-600 h-full rounded-full transition-all duration-1000" style="width: ${project.Progress || 0}%"></div>
                            </div>
                            <div class="flex justify-between items-center">
                                <p class="text-[10px] font-black text-black uppercase">${project.Contractor || 'TBD'}</p>
                                <p class="text-[9px] font-bold text-slate-400 tracking-tight">${project.PO_Number || ''}</p>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            container.innerHTML += cardHTML;
        });
    }

    fetchDashboardData();
    setInterval(fetchDashboardData, 300000); // 5-minute sync
</script>
</body>
</html>
</component>
